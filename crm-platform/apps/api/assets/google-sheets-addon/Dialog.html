<!doctype html>
<html lang="en">
  <head>
    <base target="_top" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CRM sync</title>
    <style>
      body {
        font:
          14px/1.45 Arial,
          sans-serif;
        color: #1f2933;
        margin: 0;
        padding: 16px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 4px;
      }
      p {
        margin: 6px 0;
      }
      .muted {
        color: #5f6c7b;
      }
      label {
        display: block;
        font-weight: bold;
        margin: 12px 0 4px;
      }
      input[type='text'],
      select,
      textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
        font: inherit;
        border: 1px solid #9aa5b1;
        border-radius: 4px;
      }
      input:focus,
      select:focus,
      textarea:focus,
      button:focus {
        outline: 2px solid #1a73e8;
        outline-offset: 1px;
      }
      .field-error {
        color: #b3261e;
        margin: 4px 0 0;
      }
      .row {
        display: flex;
        gap: 8px;
        margin-top: 14px;
        flex-wrap: wrap;
      }
      button {
        font: inherit;
        padding: 8px 14px;
        border-radius: 4px;
        border: 1px solid #1a73e8;
        background: #1a73e8;
        color: #fff;
        cursor: pointer;
      }
      button.secondary {
        background: #fff;
        color: #1a73e8;
      }
      button[disabled] {
        opacity: 0.6;
        cursor: default;
      }
      .box {
        border: 1px solid #d3d9e0;
        border-radius: 6px;
        padding: 10px 12px;
        margin-top: 12px;
      }
      .ok {
        border-color: #1e7e34;
        background: #eef8f0;
      }
      .warn {
        border-color: #b26a00;
        background: #fff7e6;
      }
      .error {
        border-color: #b3261e;
        background: #fdf0ef;
        color: #7a1a15;
      }
      ul {
        margin: 6px 0 0 18px;
        padding: 0;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <h1 id="title"></h1>
    <p id="intro" class="muted"></p>

    <div id="blocked" class="box error" role="alert" hidden></div>
    <div id="loading" role="status">Loading...</div>

    <form id="form" novalidate hidden>
      <div id="pullFields" hidden>
        <label for="q">Search (optional)</label>
        <input id="q" type="text" autocomplete="off" aria-describedby="qHint" />
        <p id="qHint" class="muted">
          Only contacts whose name, email or phone match are pulled. Leave empty for all.
        </p>
      </div>

      <div id="pushFields" hidden>
        <label for="countryCode">Country code for numbers without one (optional)</label>
        <input
          id="countryCode"
          type="text"
          autocomplete="off"
          placeholder="+91"
          aria-describedby="ccHint"
        />
        <p id="ccHint" class="muted">
          Used only for phone numbers that do not start with their own country code.
        </p>
      </div>

      <div id="shopFields" hidden>
        <label for="shopPick">Shop</label>
        <select id="shopPick"></select>
        <label for="shopName">Shop name</label>
        <input
          id="shopName"
          type="text"
          maxlength="191"
          autocomplete="off"
          aria-describedby="shopNameError"
        />
        <p id="shopNameError" class="field-error" hidden></p>
        <label for="currency">Currency (optional)</label>
        <input
          id="currency"
          type="text"
          maxlength="3"
          autocomplete="off"
          placeholder="INR"
          aria-describedby="currencyError"
        />
        <p id="currencyError" class="field-error" hidden></p>
        <label for="description">Shop description (optional)</label>
        <textarea id="description" rows="3" maxlength="2000"></textarea>
      </div>

      <p id="note" class="muted"></p>
      <div class="row">
        <button id="run" type="submit"></button>
        <button id="close" type="button" class="secondary">Close</button>
      </div>
    </form>

    <div id="result" role="status" aria-live="polite"></div>

    <script>
      var MODE = '<?= mode ?>';
      var el = function (id) {
        return document.getElementById(id);
      };
      var busy = false;
      var state = null;
      var NEW_SHOP = '__new__';

      var TEXT = {
        pull: {
          title: 'Pull contacts',
          intro: 'Copies your contacts into a sheet.',
          run: 'Pull contacts',
          working: 'Pulling contacts...',
        },
        push: {
          title: 'Push contacts',
          intro: 'Sends the rows of the active sheet to your contacts.',
          run: 'Push contacts',
          working: 'Sending rows...',
        },
        products: {
          title: 'Sync products to a shop',
          intro: 'Sends the products on the active sheet to a storefront shop.',
          run: 'Sync products',
          working: 'Syncing products...',
        },
      };
      var NEEDS = { pull: 'read_contacts', push: 'write_contacts', products: 'write_catalog' };

      function setBusy(value) {
        busy = value;
        el('run').disabled = value;
      }

      function clearResult() {
        el('result').textContent = '';
      }

      function box(kind, lines, list) {
        var host = el('result');
        host.textContent = '';
        var wrap = document.createElement('div');
        wrap.className = 'box ' + kind;
        for (var i = 0; i < lines.length; i++) {
          var p = document.createElement('p');
          p.textContent = lines[i];
          wrap.appendChild(p);
        }
        if (list && list.length) {
          var ul = document.createElement('ul');
          for (var j = 0; j < list.length; j++) {
            var li = document.createElement('li');
            li.textContent = list[j];
            ul.appendChild(li);
          }
          wrap.appendChild(ul);
        }
        host.appendChild(wrap);
      }

      function failureLines(result) {
        var lines = [result.message || 'Something went wrong.'];
        var list = [];
        if (result.details) {
          for (var field in result.details) {
            var messages = result.details[field];
            for (var i = 0; i < messages.length; i++) list.push(field + ': ' + messages[i]);
          }
        }
        if (result.requestId) lines.push('Reference for support: ' + result.requestId);
        return { lines: lines, list: list };
      }

      function block(message) {
        el('loading').hidden = true;
        el('form').hidden = true;
        var b = el('blocked');
        b.hidden = false;
        b.textContent = message;
      }

      function fieldError(id, message) {
        var node = el(id + 'Error');
        node.hidden = !message;
        node.textContent = message || '';
        el(id).setAttribute('aria-invalid', message ? 'true' : 'false');
      }

      function showForm() {
        el('loading').hidden = true;
        el('form').hidden = false;
        el('pullFields').hidden = MODE !== 'pull';
        el('pushFields').hidden = MODE !== 'push';
        el('shopFields').hidden = MODE !== 'products';
        el('run').textContent = TEXT[MODE].run;
        if (MODE === 'pull') {
          el('note').textContent =
            'This replaces everything on the sheet named "' +
            state.pullSheet +
            '" (it is created if it does not exist).';
        } else if (MODE === 'push') {
          el('note').textContent =
            'Sheet: "' +
            state.sheetName +
            '". Row 1 holds the column names (email or phone is required). Each row\'s result is written to the "CRM status" column.';
        } else {
          el('note').textContent =
            'Sheet: "' +
            state.sheetName +
            '". Row 1 needs the columns name and price. Each row\'s result is written to the "CRM status" column.';
        }
        el('run').focus();
      }

      function fillShops(listing) {
        var pick = el('shopPick');
        pick.textContent = '';
        var option = document.createElement('option');
        option.value = NEW_SHOP;
        option.textContent = 'Create a new shop';
        pick.appendChild(option);
        var found = false;
        for (var i = 0; i < listing.shops.length; i++) {
          var shop = listing.shops[i];
          var o = document.createElement('option');
          o.value = shop.id;
          o.textContent = shop.name + (shop.currency ? ' (' + shop.currency + ')' : '');
          o.setAttribute('data-name', shop.name);
          o.setAttribute('data-currency', shop.currency || '');
          pick.appendChild(o);
          if (shop.id === listing.shopId) found = true;
        }
        pick.value = found ? listing.shopId : NEW_SHOP;
        syncShopName(found ? listing.shopName : '');
      }

      function syncShopName(fallback) {
        var pick = el('shopPick');
        var chosen = pick.options[pick.selectedIndex];
        if (chosen && chosen.value !== NEW_SHOP) {
          el('shopName').value = chosen.getAttribute('data-name') || fallback || '';
          el('currency').value = chosen.getAttribute('data-currency') || '';
        } else if (fallback) {
          el('shopName').value = fallback;
        }
      }

      function init() {
        var text = TEXT[MODE];
        if (!text) {
          block('This window was opened without an action.');
          return;
        }
        el('title').textContent = text.title;
        el('intro').textContent = text.intro;
        google.script.run
          .withSuccessHandler(function (s) {
            state = s;
            if (!s.hasKey) {
              block(
                'No key is saved yet. Close this window, open CRM > Settings and paste your key.',
              );
              return;
            }
            if (s.can && s.can[NEEDS[MODE]] === false) {
              block(
                'Your role cannot do this. Ask an admin to change your role, or use another action from the CRM menu.',
              );
              return;
            }
            if (MODE === 'products') {
              google.script.run
                .withSuccessHandler(function (listing) {
                  if (listing.ok) fillShops(listing);
                  else {
                    // Listing shops needs catalog read. Syncing can still work, so offer a new shop and say why the list is missing.
                    fillShops({ shops: [], shopId: s.shopId, shopName: s.shopName });
                    box('warn', ['The shop list could not be loaded: ' + listing.message]);
                  }
                  showForm();
                })
                .withFailureHandler(function () {
                  block('The add-on could not run. Close this window and try again.');
                })
                .listShops();
              return;
            }
            showForm();
          })
          .withFailureHandler(function () {
            block('The add-on could not run. Close this window and try again.');
          })
          .getDialogState();
      }

      function plural(n, one, many) {
        return n + ' ' + (n === 1 ? one : many);
      }

      function showSync(result) {
        var head = [];
        head.push(
          'Sent ' +
            plural(result.rows, 'row', 'rows') +
            ': ' +
            result.created +
            ' created, ' +
            result.updated +
            ' updated, ' +
            result.unchanged +
            ' unchanged, ' +
            result.failed +
            ' failed' +
            (result.notSent ? ', ' + result.notSent + ' not sent' : '') +
            '.',
        );
        if (result.shop)
          head.push(
            'Shop: ' +
              result.shop.name +
              (result.shop.created ? ' (new)' : '') +
              (result.shop.url ? ' - ' + result.shop.url : ''),
          );
        if (result.failed || result.notSent)
          head.push('See the "' + result.statusColumn + '" column for each row.');
        var list = result.problems || [];
        if (!result.ok) {
          var f = failureLines(result);
          box('error', f.lines.concat(head), f.list.concat(list));
        } else {
          box(result.failed ? 'warn' : 'ok', head, list);
        }
      }

      el('shopPick').addEventListener('change', function () {
        syncShopName('');
      });

      el('form').addEventListener('submit', function (event) {
        event.preventDefault();
        if (busy) return;
        clearResult();
        var failed = function (r) {
          setBusy(false);
          var f = failureLines(r);
          box('error', f.lines, f.list);
        };
        var crashed = function () {
          setBusy(false);
          box('error', ['The add-on could not run. Close this window and try again.']);
        };
        if (MODE === 'products') {
          fieldError('shopName', '');
          fieldError('currency', '');
          var name = el('shopName').value.trim();
          var currency = el('currency').value.trim();
          var bad = false;
          if (name === '') {
            fieldError('shopName', 'Give the shop a name.');
            bad = true;
          }
          if (currency !== '' && !/^[A-Za-z]{3}$/.test(currency)) {
            fieldError('currency', 'Use a 3-letter currency code such as INR or USD.');
            bad = true;
          }
          if (bad) {
            (name === '' ? el('shopName') : el('currency')).focus();
            return;
          }
          setBusy(true);
          box('', [TEXT.products.working]);
          var picked = el('shopPick').value;
          google.script.run
            .withSuccessHandler(function (r) {
              setBusy(false);
              if (r.ok === undefined || (r.ok === false && r.rows === undefined)) failed(r);
              else showSync(r);
            })
            .withFailureHandler(crashed)
            .runProductSync({
              shopId: picked === NEW_SHOP ? '' : picked,
              newShop: picked === NEW_SHOP,
              shopName: name,
              currency: currency,
              description: el('description').value,
            });
          return;
        }
        setBusy(true);
        box('', [TEXT[MODE].working]);
        if (MODE === 'pull') {
          google.script.run
            .withSuccessHandler(function (r) {
              setBusy(false);
              if (!r.ok) {
                failed(r);
                return;
              }
              var lines = [
                r.pulled === 0
                  ? r.message || 'No contacts.'
                  : 'Pulled ' +
                    plural(r.pulled, 'contact', 'contacts') +
                    ' into the sheet "' +
                    r.sheet +
                    '".',
              ];
              if (r.truncated)
                lines.push(
                  'There are more contacts than one pull returns. Use the search box to pull the rest.',
                );
              box(r.truncated ? 'warn' : 'ok', lines);
            })
            .withFailureHandler(crashed)
            .runPull({ q: el('q').value });
        } else {
          google.script.run
            .withSuccessHandler(function (r) {
              setBusy(false);
              if (r.rows === undefined) failed(r);
              else showSync(r);
            })
            .withFailureHandler(crashed)
            .runPush({ countryCode: el('countryCode').value });
        }
      });

      el('close').addEventListener('click', function () {
        google.script.host.close();
      });

      init();
    </script>
  </body>
</html>
