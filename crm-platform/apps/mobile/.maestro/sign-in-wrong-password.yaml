# A wrong password shows the translated message and does not sign in.
#   maestro test apps/mobile/.maestro/sign-in-wrong-password.yaml -e APP_ID=ai.geta.crm.dev -e E2E_EMAIL=<seeded email>
appId: ${APP_ID}
---
- launchApp:
    clearState: true
- tapOn: 'Email'
- inputText: ${E2E_EMAIL}
- tapOn: 'Password'
- inputText: 'definitely-not-the-password'
- hideKeyboard
- tapOn:
    id: 'sign-in-submit'
- assertVisible: 'The email or password is incorrect.'
- assertNotVisible: 'Good (morning|afternoon|evening).*'
