# An account an administrator forced to change its password is held on the lock screen until it does, then the app opens.
# Needs a seeded account with `force_password_change` on (user_security) and the password rules of the workspace.
#   maestro test apps/mobile/.maestro/gate-password-change.yaml -e APP_ID=ai.geta.crm.dev -e E2E_EMAIL=<gated email> -e E2E_PASSWORD=<its password> -e E2E_NEW_PASSWORD=<a new password that meets the rules>
appId: ${APP_ID}
---
- launchApp:
    clearState: true
- tapOn: 'Email'
- inputText: ${E2E_EMAIL}
- tapOn: 'Password'
- inputText: ${E2E_PASSWORD}
- hideKeyboard
- tapOn:
    id: 'sign-in-submit'
- assertVisible: 'You need to set a new password before you can continue.*'
- assertNotVisible: 'Good (morning|afternoon|evening).*'
- tapOn: 'Current password'
- inputText: ${E2E_PASSWORD}
- tapOn: 'New password'
- inputText: ${E2E_NEW_PASSWORD}
- tapOn: 'Confirm new password'
- inputText: ${E2E_NEW_PASSWORD}
- hideKeyboard
- tapOn:
    id: 'gate-password-submit'
- assertVisible: 'Good (morning|afternoon|evening).*'
