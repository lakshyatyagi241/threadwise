# Forgot password: the sign-in screen opens the request screen, the request is sent, and the person is told to check the inbox.
# The mail goes to the workspace's mail server (Mailpit locally). Use any address: the answer is the same whether or not it has an account.
#   maestro test apps/mobile/.maestro/forgot-password.yaml -e APP_ID=ai.geta.crm.dev -e E2E_ORG=<workspace slug> -e E2E_EMAIL=<any email>
appId: ${APP_ID}
---
- launchApp:
    clearState: true
- tapOn: 'Forgot password?'
- assertVisible: 'Reset your password'
- tapOn: 'Workspace'
- inputText: ${E2E_ORG}
- tapOn: 'Email'
- inputText: ${E2E_EMAIL}
- hideKeyboard
- tapOn:
    id: 'recovery-submit'
- assertVisible: 'Check your inbox'
- assertVisible: 'Open the link on this phone.*'
- tapOn: 'Back to sign in'
- assertVisible: 'Welcome back'
