name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  static:
    name: Lint · typecheck · architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @crm/contracts build
      - run: pnpm --filter @crm/db build

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

      # Module boundaries are a decision, not a suggestion — a PR that breaks
      # them fails here rather than in review six months later.
      - name: Architecture boundaries
        run: pnpm arch:check

      - name: Web app builds
        run: pnpm --filter @crm/web build

  test:
    name: Unit + integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: crm
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U crm"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      # CI's service container has no restricted role, so the migration smoke
      # test runs as the owner. Real isolation is proven by the integration
      # suite, which creates its own container AND its own non-superuser role —
      # that is the assertion that matters.
      DATABASE_URL: postgres://crm:crm@localhost:5432/crm
      MIGRATION_DATABASE_URL: postgres://crm:crm@localhost:5432/crm
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-ci-access-secret-ci-access
      JWT_REFRESH_SECRET: ci-refresh-secret-ci-refresh-secret-ci-refr
      CREDENTIALS_ENCRYPTION_KEY: ZGV2LW9ubHktMzItYnl0ZS1rZXktZG8tbm90LXVzZSE=

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @crm/contracts build
      - run: pnpm --filter @crm/db build

      - name: Migrations apply cleanly from scratch
        run: pnpm db:migrate

      - name: Migrations are immutable and in sync
        run: pnpm db:status

      - name: Drizzle schema matches the migrated database
        run: pnpm db:verify-schema

      - run: pnpm test

      # Testcontainers spins its own Postgres — these tests must not depend on
      # the service container above, so isolation is proven end to end.
      - name: Integration (testcontainers)
        run: pnpm test:integration

  build:
    name: Build image
    runs-on: ubuntu-latest
    needs: [static]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
