# Event-loop metrics, alerting and a caller-side probe, next to the app. Optional and additive: nothing here runs unless this file is
# named, and docker-compose.yml alone is unchanged by it.
#
#   ./observability-up.sh        # first time: makes the token, asks where alerts go, starts everything
#   docker compose -f docker-compose.yml -f observability.compose.yml --env-file .env up -d     # afterwards
#
# What it adds
#   api, worker, web   serve /metrics on 9464 inside the stack network (token required), published nowhere
#   probe         a separate process that GETs the API from outside its event loop and reports the latency a caller sees
#   prometheus    scrapes the four, evaluates ../observability/event-loop.rules.yml, keeps 15 days (or 2 GB)
#   alertmanager  sends firing and resolved alerts to the URL in secrets/alert_webhook_url
#
# Nothing is published and nothing is routed through Traefik: reach Prometheus and Alertmanager with
#   docker compose -f docker-compose.yml -f observability.compose.yml exec prometheus wget -qO- http://localhost:9090/api/v1/targets
# or an SSH tunnel. Memory budget on the shared host: prometheus 384m, alertmanager 128m, probe 128m.
#
# The Prometheus and Alertmanager images are public images pulled from Docker Hub (the app images are loaded, not pulled): the host
# needs one `docker compose pull prometheus alertmanager` with internet access.

# Anchors do not cross compose files, so the base file's log rotation is repeated here (a shared host, logs must not grow forever).
x-obs-logging: &obs-logging
  driver: json-file
  options:
    max-size: 20m
    max-file: '5'

services:
  api:
    environment:
      OBS_RELEASE: ${IMAGE_TAG:-local}
      OBS_METRICS_PORT: '9464'
      OBS_METRICS_TOKEN: ${OBS_METRICS_TOKEN:?run ./observability-up.sh, it generates OBS_METRICS_TOKEN}

  worker:
    environment:
      OBS_RELEASE: ${IMAGE_TAG:-local}
      OBS_METRICS_PORT: '9464'
      OBS_METRICS_TOKEN: ${OBS_METRICS_TOKEN:?run ./observability-up.sh, it generates OBS_METRICS_TOKEN}

  web:
    environment:
      OBS_RELEASE: ${IMAGE_TAG:-local}
      OBS_METRICS_PORT: '9464'
      OBS_METRICS_HOST: 0.0.0.0
      OBS_METRICS_TOKEN: ${OBS_METRICS_TOKEN:?run ./observability-up.sh, it generates OBS_METRICS_TOKEN}

  probe:
    image: desk-api:${IMAGE_TAG:-local}
    pull_policy: never
    command: ['node', 'dist/src/tools/event-loop-probe.js']
    restart: unless-stopped
    mem_limit: 128m
    logging: *obs-logging
    environment:
      NODE_ENV: production
      TZ: UTC
      PROBE_TARGETS: health=http://api:3000/health,ready=http://api:3000/ready,web=http://web:3001/robots.txt
      PROBE_INTERVAL_SECONDS: '10'
      PROBE_TIMEOUT_SECONDS: '10'
      OBS_METRICS_PORT: '9464'
      OBS_METRICS_HOST: 0.0.0.0
      OBS_METRICS_TOKEN: ${OBS_METRICS_TOKEN:?run ./observability-up.sh, it generates OBS_METRICS_TOKEN}
    depends_on:
      - api
      - web

  prometheus:
    image: prom/prometheus:v2.55.0
    restart: unless-stopped
    mem_limit: 384m
    logging: *obs-logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/event-loop.rules.yml:/etc/prometheus/event-loop.rules.yml:ro
      - ../observability/queue-capacity.rules.yml:/etc/prometheus/queue-capacity.rules.yml:ro
      - promdata:/prometheus
    secrets: [obs_metrics_token]
    depends_on:
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    mem_limit: 128m
    logging: *obs-logging
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ../observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - amdata:/alertmanager
    secrets: [alert_webhook_url]

secrets:
  obs_metrics_token:
    file: ./secrets/obs_metrics_token
  alert_webhook_url:
    file: ./secrets/alert_webhook_url

volumes:
  promdata:
  amdata:
