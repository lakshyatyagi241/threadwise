# desk.wabo.ai on a shared Dokploy host. The host's Traefik owns 80/443 and issues the certificate (resolver `letsencrypt`):
# this stack publishes no ports and routes through labels on `dokploy-network`. Images are built elsewhere and loaded
# (`pull_policy: never`), so the host never runs a build.
#   docker compose --env-file .env up -d
# Fresh database: postgres + init-roles.sh create the roles, `migrate` applies every migration; seed.sh adds the accounts.

name: desk

# Docker's json-file driver keeps every log line forever unless told otherwise, on a host shared with many other apps. Every
# container has this block. The app containers are recreated on every release, so it cost nothing there; postgres, redis and
# the object store were first left without it so that adding it would not restart the database. They have it now (the slow-query log and
# pg_stat_statements make postgres the chattiest container): the FIRST `docker compose up -d` after this change recreates them
# (a few seconds of downtime, data is on the named volumes), so take that release at a quiet hour. Later releases do not touch them.
x-app-logging: &app-logging
  driver: json-file
  options:
    max-size: 20m
    max-file: '5'

x-api-env: &api-env
  NODE_ENV: production
  TZ: UTC
  PORT: '3000'
  NODE_OPTIONS: --max-old-space-size=640
  DB_POOL_MAX: '10'
  # Where the message counts come from: JSON map of metric to legacy | shadow | rollup (docs/superpowers/specs/2026-10-19-message-count-rollup-design.md).
  # Empty means legacy (scan). Set it in .env after `backfill:message-feed`; the History KPIs went from 800 ms to 28 ms on 1M messages.
  ANALYTICS_SOURCES: ${ANALYTICS_SOURCES:-}
  # Two small pools beside the main one, so the public webhook path and the readiness probe never queue behind (or starve) the pool
  # the dashboard uses. They are per process: the real ceiling is (slots + hooks + worker) x (DB_POOL_MAX + these) against Postgres'
  # max_connections=100 (see the postgres service).
  WEBHOOK_DB_POOL_MAX: '6'
  HEALTH_DB_POOL_MAX: '2'
  APP_URL: https://${DOMAIN}
  WEB_APP_URL: https://${DOMAIN}
  # The origin the chat widget's embed script and chat page point back at; the API container's own name must never end up in a snippet.
  WIDGET_PUBLIC_BASE_URL: https://${DOMAIN}
  CORS_ORIGINS: https://${DOMAIN}
  APP_NAME: ${APP_NAME}
  TRUST_PROXY: loopback,linklocal,uniquelocal
  WEB_TRUSTED_PROXY_HOPS: '1'
  DATABASE_URL: postgres://crm_app_user:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
  DATABASE_REPLICA_URL: postgres://crm_app_user:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
  MIGRATION_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
  JWT_ACCESS_TTL: 15m
  JWT_REFRESH_TTL: 30d
  CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY}
  # Older keys, comma-separated, for reading only. Empty except during a key rotation (docs/runbooks/key-rotation.md).
  CREDENTIALS_ENCRYPTION_PREVIOUS_KEYS: ${CREDENTIALS_ENCRYPTION_PREVIOUS_KEYS:-}
  # Error reporting. The DSN is public by design (it only lets events in), so it is the default here; set SENTRY_DSN= (empty) in .env to turn reporting off.
  SENTRY_DSN: ${SENTRY_DSN-https://7a686f169d4a7b804e5eb7b6fdd9e806@o4507446172188672.ingest.us.sentry.io/4512202246324224}
  CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
  # api and worker are separate containers: media must live in the bucket, not on a container's own disk. The bucket is Cloudflare R2
  # (any S3-compatible store works); every value comes from .env and a release refuses to start without them.
  MEDIA_STORAGE_DRIVER: s3
  S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT (https://<account id>.r2.cloudflarestorage.com) in .env}
  S3_REGION: ${S3_REGION:-auto}
  S3_BUCKET_MEDIA: ${S3_BUCKET_MEDIA:?set S3_BUCKET_MEDIA in .env}
  S3_BUCKET_DOCUMENTS: ${S3_BUCKET_DOCUMENTS:?set S3_BUCKET_DOCUMENTS in .env}
  S3_BUCKET_EXPORTS: ${S3_BUCKET_EXPORTS:?set S3_BUCKET_EXPORTS in .env}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
  SMTP_HOST: ${SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT}
  SMTP_FROM: ${SMTP_FROM}
  WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}
  WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET}
  # The Help assistant's model vendor; the model is that vendor's default model in the platform AI keys (HELP_AGENT_MODEL overrides it).
  HELP_AGENT_PROVIDER: ${HELP_AGENT_PROVIDER:-openrouter}
  HELP_AGENT_MODEL: ${HELP_AGENT_MODEL:-}
  # WhatsApp Cloud API / Interakt embedded signup (blank = "not configured" on the Channels screen).
  WABA_DEFAULT_PROVIDER: ${WABA_DEFAULT_PROVIDER:-interakt}
  WABA_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}
  WABA_WEBHOOK_PUBLIC_URL: https://${DOMAIN}
  META_APP_ID: ${META_APP_ID:-}
  META_APP_SECRET: ${META_APP_SECRET:-}
  META_EMBEDDED_CONFIG_ID: ${META_EMBEDDED_CONFIG_ID:-}
  META_CATALOGUE_CONFIG_ID: ${META_CATALOGUE_CONFIG_ID:-}
  INTERAKT_PARTNER_AUTH_KEY: ${INTERAKT_PARTNER_AUTH_KEY:-}
  INTERAKT_SOLUTION_ID: ${INTERAKT_SOLUTION_ID:-}
  META_SYSTEM_USER_ID: ${META_SYSTEM_USER_ID:-}
  META_SYSTEM_USER_TOKEN: ${META_SYSTEM_USER_TOKEN:-}
  META_BUSINESS_ID: ${META_BUSINESS_ID:-}
  # Offer "connect my existing Business App number" (coexistence) in Embedded Signup.
  WABA_COEXISTENCE: ${WABA_COEXISTENCE:-false}
  WABA_TRUSTED_FORWARDER_IPS: ${WABA_TRUSTED_FORWARDER_IPS:-}
  # Google Calendar for workspaces (blank = set the client on the console's Google Calendar page instead).
  GOOGLE_CALENDAR_CLIENT_ID: ${GOOGLE_CALENDAR_CLIENT_ID:-}
  GOOGLE_CALENDAR_CLIENT_SECRET: ${GOOGLE_CALENDAR_CLIENT_SECRET:-}
  # Waboo migration panel: "remote" = the pipeline runs on a runner agent on a machine on the Geta VPN (tools/migration/pilot/staging/runner-agent.cjs).
  # The token (32+ characters) is shared with the agent; empty = the agent endpoints refuse everyone. Runbook: tools/migration/pilot/staging/STAGING-RUNBOOK.md.
  WABOO_MIGRATE_RUNNER: ${WABOO_MIGRATE_RUNNER:-}
  WABOO_RUNNER_TOKEN: ${WABOO_RUNNER_TOKEN:-}
  WABOO_RUNNER_PICKUP_MIN: ${WABOO_RUNNER_PICKUP_MIN:-}
  WABOO_RUNNER_SILENCE_MIN: ${WABOO_RUNNER_SILENCE_MIN:-}
  WABOO_MIGRATE_TIMEOUT_MIN: ${WABOO_MIGRATE_TIMEOUT_MIN:-}
  # Event-loop and runtime metrics (docs/performance/event-loop). Every process measures itself; this only decides whether /metrics
  # is served. Off by default (port 0): deploying this file changes nothing. observability.compose.yml turns it on together with a
  # Prometheus, an Alertmanager and a probe. The listener refuses to open on a non-loopback host without a token, so setting the port
  # alone cannot expose it unauthenticated.
  OBS_METRICS_PORT: ${OBS_METRICS_PORT:-0}
  OBS_METRICS_HOST: ${OBS_METRICS_HOST:-0.0.0.0}
  OBS_METRICS_TOKEN: ${OBS_METRICS_TOKEN:-}

# Slot settings shared by api-blue and api-green. No Traefik labels: the public routes live in the routing file, not on the containers.
x-api-slot: &api-slot
  pull_policy: never
  restart: unless-stopped
  mem_limit: 1536m
  # Docker kills a container 10 s after SIGTERM by default. The API closes HTTP and websocket connections on SIGTERM; give slow
  # requests time to finish instead of cutting them off on every release.
  stop_grace_period: 30s
  logging: *app-logging
  # The alias `api` is shared by both slots and resolves only to a running one: Prometheus (deploy/observability) and the probe find the
  # API by it, so a stopped slot is not a failed scrape. Public traffic never uses it (the routing file names the slot's container).
  networks:
    default:
      aliases: [api]
    dokploy-network: {}
  healthcheck:
    test:
      [
        'CMD',
        'node',
        '-e',
        "fetch('http://127.0.0.1:3000/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
      ]
    interval: 10s
    timeout: 5s
    retries: 6
    start_period: 30s
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    migrate: { condition: service_completed_successfully }

# Slot settings shared by web-blue and web-green.
x-web-slot: &web-slot
  pull_policy: never
  restart: unless-stopped
  mem_limit: 768m
  stop_grace_period: 20s
  logging: *app-logging
  # Same idea as the API's alias: `web` resolves to whichever slot is running.
  networks:
    default:
      aliases: [web]
    dokploy-network: {}
  healthcheck:
    test:
      [
        'CMD',
        'node',
        '-e',
        "fetch('http://127.0.0.1:3001/login').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
      ]
    interval: 10s
    timeout: 5s
    retries: 6
    start_period: 30s

x-web-env: &web-env
  NODE_ENV: production
  TZ: UTC
  # The traced server binds to $HOSTNAME, which Docker sets to the container id unless it is given here; the healthcheck calls 127.0.0.1.
  HOSTNAME: 0.0.0.0
  NODE_OPTIONS: --max-old-space-size=512
  SENTRY_DSN: ${SENTRY_DSN-https://7a686f169d4a7b804e5eb7b6fdd9e806@o4507446172188672.ingest.us.sentry.io/4512202246324224}
  REALTIME_URL: https://${DOMAIN}/realtime
  # What the Developers page shows customers as the API address. API_URL (per slot, below) is the internal container name and must never be shown.
  PUBLIC_API_URL: https://${DOMAIN}
  # Event-loop and runtime metrics of the Next.js server, same switches as the API's (see x-api-env): off unless a port is set.
  OBS_METRICS_PORT: ${OBS_METRICS_PORT:-0}
  OBS_METRICS_HOST: ${OBS_METRICS_HOST:-0.0.0.0}
  OBS_METRICS_TOKEN: ${OBS_METRICS_TOKEN:-}

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD}
    # Sized for a shared host (see PG_* in .env); the repo's docker-compose.prod.yml assumes a 16 GB+ machine. 2g (was 1g: the database sat
    # at its cap under webhook load); keep PG_SHARED_BUFFERS about a quarter of it and PG_EFFECTIVE_CACHE_SIZE about three quarters.
    # max_connections=100 covers the API slots (two during a switch), the webhook API and the worker at their pool sizes.
    mem_limit: 2g
    logging: *app-logging
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE}
      - -c
      - random_page_cost=1.1
      - -c
      - log_min_duration_statement=500
      # per-statement time, calls and rows: ranks slow queries by total time and p95 (QA 41); the log alone has no statistics
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # noeviction: BullMQ job state is not a cache.
    mem_limit: 512m
    logging: *app-logging
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory-policy',
        'noeviction',
        '--maxmemory',
        '448mb',
      ]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  # Nightly pg_dump with a verified archive, kept on the host in ./backups (14 days, never fewer than the newest 3), plus a dump on
  # demand that the release takes before it migrates. The script is written out here rather than shipped as a file because the
  # deploy only copies an allow-listed set of names. Restore: docs/runbooks/backup-restore.md. This is a copy on the SAME host:
  # it protects against a bad migration and a dropped table, not against losing the machine (see "Not set up" in the README).
  backup:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    mem_limit: 192m
    logging: *app-logging
    entrypoint: ['bash', '-c']
    command:
      - |
        cat > /usr/local/bin/desk-backup <<'SCRIPT'
        #!/usr/bin/env bash
        # desk-backup [loop | once <label>]
        set -u
        umask 077
        DIR=/backups
        KEEP=$${BACKUP_KEEP_DAYS:-14}
        HOUR=$${BACKUP_HOUR_UTC:-2}
        log() { echo "$$(date -u +%FT%TZ) backup: $$*"; }

        # One dump, verified (the archive must list back) and only then given its final name. 0 means a good dump.
        dump() {
          local label=$$1 ts f
          ts=$$(date -u +%Y%m%dT%H%M%SZ)
          f="$$DIR/desk-$$label-$$ts.dump"
          if pg_dump -Fc -f "$$f.part" && [ -s "$$f.part" ] && pg_restore --list "$$f.part" > /dev/null; then
            mv "$$f.part" "$$f"
            touch "$$DIR/.last-ok"
            log "ok $$(basename "$$f") $$(du -h "$$f" | cut -f1)"
            prune
            return 0
          fi
          rm -f "$$f.part"
          log "FAILED ($$label)"
          return 1
        }

        # Older than KEEP days goes, but the newest three always stay: if dumps stop for a month, the last good ones must not age out.
        prune() {
          ls -1t "$$DIR"/desk-*.dump 2> /dev/null | tail -n +4 | while read -r old; do
            [ -n "$$(find "$$old" -mtime +"$$KEEP")" ] && rm -f "$$old" && log "pruned $$(basename "$$old")"
          done
          return 0
        }

        case "$${1:-loop}" in
          once) dump "$${2:-manual}" ;;
          loop)
            [ -e "$$DIR/.last-ok" ] || dump initial || true
            while true; do
              now=$$(date -u +%s)
              next=$$(date -u -d "today $$(printf '%02d' "$$HOUR"):00:00" +%s)
              [ "$$next" -le "$$now" ] && next=$$((next + 86400))
              sleep $$((next - now))
              dump daily || true
            done
            ;;
          *) echo "usage: desk-backup [loop | once <label>]" >&2; exit 2 ;;
        esac
        SCRIPT
        chmod +x /usr/local/bin/desk-backup
        exec desk-backup loop
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      TZ: UTC
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-2}
    volumes:
      - ./backups:/backups
    # Healthy while the last good dump is under 26 hours old (a missed night is noticed the next day).
    healthcheck:
      test: ['CMD-SHELL', 'find /backups/.last-ok -mmin -1560 2>/dev/null | grep -q .']
      interval: 5m
      timeout: 10s
      retries: 1
      start_period: 3m
    depends_on:
      postgres: { condition: service_healthy }

  # Copies the verified dumps in ./backups to a Cloudflare R2 (any S3-compatible) bucket, sealed with a key that is not the bucket's: a
  # dump holds every tenant's data, so a leaked bucket key alone must not read it. Does nothing, once and loudly, until the
  # OFFSITE_* settings are in .env (it then stays stopped; `docker compose up -d offsite` after adding them). Runs in the API image,
  # so it is recreated with every release. Keeps 30 days of dumps plus the first of each month for a year. Recovery:
  # docs/runbooks/backup-restore.md ("Off the host").
  offsite:
    image: desk-api:${IMAGE_TAG:-local}
    pull_policy: never
    command:
      [
        'node',
        'dist/src/modules/platform-infrastructure/offsite-backup/offsite-backup.cli.js',
        'loop',
      ]
    restart: on-failure
    mem_limit: 256m
    logging: *app-logging
    environment:
      NODE_ENV: production
      TZ: UTC
      OFFSITE_S3_ENDPOINT: ${OFFSITE_S3_ENDPOINT:-}
      OFFSITE_S3_BUCKET: ${OFFSITE_S3_BUCKET:-}
      OFFSITE_S3_ACCESS_KEY_ID: ${OFFSITE_S3_ACCESS_KEY_ID:-}
      OFFSITE_S3_SECRET_ACCESS_KEY: ${OFFSITE_S3_SECRET_ACCESS_KEY:-}
      OFFSITE_S3_REGION: ${OFFSITE_S3_REGION:-auto}
      OFFSITE_S3_PREFIX: ${OFFSITE_S3_PREFIX:-desk}
      OFFSITE_BACKUP_KEY: ${OFFSITE_BACKUP_KEY:-}
      OFFSITE_BACKUP_PREVIOUS_KEYS: ${OFFSITE_BACKUP_PREVIOUS_KEYS:-}
      OFFSITE_SYNC_MINUTES: ${OFFSITE_SYNC_MINUTES:-30}
    volumes:
      - ./backups:/backups:ro
      # /tmp holds the offsite-ok marker; as a named volume the probe (observability.compose.yml) can read its age (OffsiteBackupStale).
      - offsite_state:/tmp
    # Healthy while a whole pass has succeeded in the last two hours.
    healthcheck:
      test: ['CMD-SHELL', 'find /tmp/offsite-ok -mmin -120 2>/dev/null | grep -q .']
      interval: 5m
      timeout: 10s
      retries: 1
      start_period: 10m
    depends_on:
      backup: { condition: service_started }

  # One-shot: applies every migration as the database owner, with the migrate CLI that ships inside the API image.
  migrate:
    image: desk-api:${IMAGE_TAG:-local}
    pull_policy: never
    working_dir: /app
    command: ['node', 'node_modules/@crm/db/dist/cli/migrate.js', 'up']
    restart: 'no'
    logging: *app-logging
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MIGRATION_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres: { condition: service_healthy }

  # Two slots, blue and green. Each is an API and a web container. A release starts the IDLE slot on the new image, waits for it to be
  # healthy, moves the public routes to it (deploy/hostinger/traefik-desk.yml.template, written by ci-entry.sh) and stops the old one.
  # The old slot serves until that switch, so a release causes no downtime. The worker is not in a slot: one instance only, because its
  # schedulers must not run twice; it is restarted on the new image with a long graceful stop.
  api-blue:
    <<: *api-slot
    container_name: desk-api-blue
    image: desk-api:${SLOT_BLUE_TAG:-${IMAGE_TAG:-local}}
    environment:
      <<: *api-env
      WORKER_MODE: 'false'
      OBS_RELEASE: ${SLOT_BLUE_TAG:-${IMAGE_TAG:-local}}

  api-green:
    <<: *api-slot
    container_name: desk-api-green
    image: desk-api:${SLOT_GREEN_TAG:-${IMAGE_TAG:-local}}
    environment:
      <<: *api-env
      WORKER_MODE: 'false'
      OBS_RELEASE: ${SLOT_GREEN_TAG:-${IMAGE_TAG:-local}}

  # The public webhook receiver, on its own container (and its own DB pools), so a webhook flood cannot slow the dashboard API and a
  # dashboard stall cannot make providers retry. Not in a slot: Traefik sends /v2/public/webhooks here (traefik-desk.yml.template) and
  # falls back to the live slot's API while this one is not healthy, so a restart of it costs nothing. No `api` alias: Prometheus, the
  # probe and the web server keep finding the slots only (Prometheus scrapes this one by its service name, job crm-api-hooks). The tag
  # is HOOKS_TAG, moved by ci-entry.sh on every release.
  api-hooks:
    <<: *api-slot
    container_name: desk-api-hooks
    image: desk-api:${HOOKS_TAG:-${IMAGE_TAG:-local}}
    mem_limit: 1g
    networks:
      default: {}
      dokploy-network: {}
    environment:
      <<: *api-env
      WORKER_MODE: 'false'
      DB_POOL_MAX: '8'
      OBS_RELEASE: ${HOOKS_TAG:-${IMAGE_TAG:-local}}

  web-blue:
    <<: *web-slot
    container_name: desk-web-blue
    image: desk-web:${SLOT_BLUE_TAG:-${IMAGE_TAG:-local}}
    environment:
      <<: *web-env
      API_URL: http://desk-api-blue:3000
      OBS_RELEASE: ${SLOT_BLUE_TAG:-${IMAGE_TAG:-local}}

  web-green:
    <<: *web-slot
    container_name: desk-web-green
    image: desk-web:${SLOT_GREEN_TAG:-${IMAGE_TAG:-local}}
    environment:
      <<: *web-env
      API_URL: http://desk-api-green:3000
      OBS_RELEASE: ${SLOT_GREEN_TAG:-${IMAGE_TAG:-local}}

  worker:
    image: desk-api:${IMAGE_TAG:-local}
    pull_policy: never
    command: ['node', 'dist/src/worker.js']
    restart: unless-stopped
    mem_limit: 1g
    # On SIGTERM the worker stops taking jobs and waits for the running ones (BullMQ) and the current outbox batch. Killed at
    # the default 10 s, a long job is abandoned and its outbox rows stay in 'processing'.
    stop_grace_period: 60s
    logging: *app-logging
    # The image's HEALTHCHECK probes the API's HTTP port, which the worker does not serve. This one asks Redis whether the worker in
    # this container has beaten in the last three intervals (see worker-probe.ts); the release waits for it to say healthy.
    healthcheck:
      test:
        ['CMD', 'node', 'dist/src/modules/platform-infrastructure/observability/worker-probe.js']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    environment:
      <<: *api-env
      WORKER_MODE: 'true'
      OBS_RELEASE: ${IMAGE_TAG:-local}
      DATABASE_URL: postgres://crm_worker_user:${WORKER_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_REPLICA_URL: postgres://crm_worker_user:${WORKER_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

networks:
  dokploy-network:
    external: true

volumes:
  pgdata:
  redisdata:
  offsite_state:
