# desk.wabo.ai on a shared Dokploy host. The host's Traefik owns 80/443 and issues the certificate (resolver `letsencrypt`):
# this stack publishes no ports and routes through labels on `dokploy-network`. Images are built elsewhere and loaded
# (`pull_policy: never`), so the host never runs a build.
#   docker compose --env-file .env up -d
# Fresh database: postgres + init-roles.sh create the roles, `migrate` applies every migration; seed.sh adds the accounts.

name: desk

# Docker's json-file driver keeps every log line forever unless told otherwise, on a host shared with many other apps. The three
# app containers are recreated on every release, so setting this on them costs nothing; postgres, redis and minio are left
# alone so that adding it never restarts the database.
x-app-logging: &app-logging
  driver: json-file
  options:
    max-size: 20m
    max-file: '5'

x-api-env: &api-env
  NODE_ENV: production
  TZ: UTC
  PORT: '3000'
  NODE_OPTIONS: --max-old-space-size=640
  DB_POOL_MAX: '10'
  APP_URL: https://${DOMAIN}
  WEB_APP_URL: https://${DOMAIN}
  CORS_ORIGINS: https://${DOMAIN}
  APP_NAME: ${APP_NAME}
  TRUST_PROXY: loopback,linklocal,uniquelocal
  WEB_TRUSTED_PROXY_HOPS: '1'
  DATABASE_URL: postgres://crm_app_user:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
  DATABASE_REPLICA_URL: postgres://crm_app_user:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
  MIGRATION_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
  JWT_ACCESS_TTL: 15m
  JWT_REFRESH_TTL: 30d
  CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY}
  # Older keys, comma-separated, for reading only. Empty except during a key rotation (docs/runbooks/key-rotation.md).
  CREDENTIALS_ENCRYPTION_PREVIOUS_KEYS: ${CREDENTIALS_ENCRYPTION_PREVIOUS_KEYS:-}
  # Error reporting. The DSN is public by design (it only lets events in), so it is the default here; set SENTRY_DSN= (empty) in .env to turn reporting off.
  SENTRY_DSN: ${SENTRY_DSN-https://7a686f169d4a7b804e5eb7b6fdd9e806@o4507446172188672.ingest.us.sentry.io/4512202246324224}
  CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
  S3_ENDPOINT: http://minio:9000
  S3_REGION: us-east-1
  S3_BUCKET_MEDIA: crm-media
  S3_BUCKET_DOCUMENTS: crm-documents
  S3_BUCKET_EXPORTS: crm-exports
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  S3_FORCE_PATH_STYLE: 'true'
  SMTP_HOST: ${SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT}
  SMTP_FROM: ${SMTP_FROM}
  WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}
  WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET}
  # WhatsApp Cloud API / Interakt embedded signup (blank = "not configured" on the Channels screen).
  WABA_DEFAULT_PROVIDER: ${WABA_DEFAULT_PROVIDER:-interakt}
  WABA_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}
  WABA_WEBHOOK_PUBLIC_URL: https://${DOMAIN}
  META_APP_ID: ${META_APP_ID:-}
  META_APP_SECRET: ${META_APP_SECRET:-}
  META_EMBEDDED_CONFIG_ID: ${META_EMBEDDED_CONFIG_ID:-}
  INTERAKT_PARTNER_AUTH_KEY: ${INTERAKT_PARTNER_AUTH_KEY:-}
  INTERAKT_SOLUTION_ID: ${INTERAKT_SOLUTION_ID:-}
  META_SYSTEM_USER_ID: ${META_SYSTEM_USER_ID:-}
  META_SYSTEM_USER_TOKEN: ${META_SYSTEM_USER_TOKEN:-}
  META_BUSINESS_ID: ${META_BUSINESS_ID:-}
  # Google Calendar for workspaces (blank = set the client on the console's Google Calendar page instead).
  GOOGLE_CALENDAR_CLIENT_ID: ${GOOGLE_CALENDAR_CLIENT_ID:-}
  GOOGLE_CALENDAR_CLIENT_SECRET: ${GOOGLE_CALENDAR_CLIENT_SECRET:-}

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD}
    # Sized for a shared host (see PG_* in .env); the repo's docker-compose.prod.yml assumes a 16 GB+ machine.
    mem_limit: 1g
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE}
      - -c
      - random_page_cost=1.1
      - -c
      - log_min_duration_statement=500
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # noeviction: BullMQ job state is not a cache.
    mem_limit: 256m
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory-policy',
        'noeviction',
        '--maxmemory',
        '192mb',
      ]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    # The registry no longer serves this image; the host has it locally. The API only probes S3 (no bucket access yet).
    image: minio/minio:latest
    pull_policy: never
    restart: unless-stopped
    mem_limit: 256m
    command: ['server', '/data']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data

  # Nightly pg_dump with a verified archive, kept on the host in ./backups (14 days, never fewer than the newest 3), plus a dump on
  # demand that the release takes before it migrates. The script is written out here rather than shipped as a file because the
  # deploy only copies an allow-listed set of names. Restore: docs/runbooks/backup-restore.md. This is a copy on the SAME host:
  # it protects against a bad migration and a dropped table, not against losing the machine (see "Not set up" in the README).
  backup:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    mem_limit: 192m
    logging: *app-logging
    entrypoint: ['bash', '-c']
    command:
      - |
        cat > /usr/local/bin/desk-backup <<'SCRIPT'
        #!/usr/bin/env bash
        # desk-backup [loop | once <label>]
        set -u
        umask 077
        DIR=/backups
        KEEP=$${BACKUP_KEEP_DAYS:-14}
        HOUR=$${BACKUP_HOUR_UTC:-2}
        log() { echo "$$(date -u +%FT%TZ) backup: $$*"; }

        # One dump, verified (the archive must list back) and only then given its final name. 0 means a good dump.
        dump() {
          local label=$$1 ts f
          ts=$$(date -u +%Y%m%dT%H%M%SZ)
          f="$$DIR/desk-$$label-$$ts.dump"
          if pg_dump -Fc -f "$$f.part" && [ -s "$$f.part" ] && pg_restore --list "$$f.part" > /dev/null; then
            mv "$$f.part" "$$f"
            touch "$$DIR/.last-ok"
            log "ok $$(basename "$$f") $$(du -h "$$f" | cut -f1)"
            prune
            return 0
          fi
          rm -f "$$f.part"
          log "FAILED ($$label)"
          return 1
        }

        # Older than KEEP days goes, but the newest three always stay: if dumps stop for a month, the last good ones must not age out.
        prune() {
          ls -1t "$$DIR"/desk-*.dump 2> /dev/null | tail -n +4 | while read -r old; do
            [ -n "$$(find "$$old" -mtime +"$$KEEP")" ] && rm -f "$$old" && log "pruned $$(basename "$$old")"
          done
          return 0
        }

        case "$${1:-loop}" in
          once) dump "$${2:-manual}" ;;
          loop)
            [ -e "$$DIR/.last-ok" ] || dump initial || true
            while true; do
              now=$$(date -u +%s)
              next=$$(date -u -d "today $$(printf '%02d' "$$HOUR"):00:00" +%s)
              [ "$$next" -le "$$now" ] && next=$$((next + 86400))
              sleep $$((next - now))
              dump daily || true
            done
            ;;
          *) echo "usage: desk-backup [loop | once <label>]" >&2; exit 2 ;;
        esac
        SCRIPT
        chmod +x /usr/local/bin/desk-backup
        exec desk-backup loop
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      TZ: UTC
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-2}
    volumes:
      - ./backups:/backups
    # Healthy while the last good dump is under 26 hours old (a missed night is noticed the next day).
    healthcheck:
      test: ['CMD-SHELL', 'find /backups/.last-ok -mmin -1560 2>/dev/null | grep -q .']
      interval: 5m
      timeout: 10s
      retries: 1
      start_period: 3m
    depends_on:
      postgres: { condition: service_healthy }

  # Copies the verified dumps in ./backups to a Cloudflare R2 (any S3-compatible) bucket, sealed with a key that is not the bucket's: a
  # dump holds every tenant's data, so a leaked bucket key alone must not read it. Does nothing, once and loudly, until the
  # OFFSITE_* settings are in .env (it then stays stopped; `docker compose up -d offsite` after adding them). Runs in the API image,
  # so it is recreated with every release. Keeps 30 days of dumps plus the first of each month for a year. Recovery:
  # docs/runbooks/backup-restore.md ("Off the host").
  offsite:
    image: desk-api:${IMAGE_TAG:-local}
    pull_policy: never
    command:
      [
        'node',
        'dist/src/modules/platform-infrastructure/offsite-backup/offsite-backup.cli.js',
        'loop',
      ]
    restart: on-failure
    mem_limit: 256m
    logging: *app-logging
    environment:
      NODE_ENV: production
      TZ: UTC
      OFFSITE_S3_ENDPOINT: ${OFFSITE_S3_ENDPOINT:-}
      OFFSITE_S3_BUCKET: ${OFFSITE_S3_BUCKET:-}
      OFFSITE_S3_ACCESS_KEY_ID: ${OFFSITE_S3_ACCESS_KEY_ID:-}
      OFFSITE_S3_SECRET_ACCESS_KEY: ${OFFSITE_S3_SECRET_ACCESS_KEY:-}
      OFFSITE_S3_REGION: ${OFFSITE_S3_REGION:-auto}
      OFFSITE_S3_PREFIX: ${OFFSITE_S3_PREFIX:-desk}
      OFFSITE_BACKUP_KEY: ${OFFSITE_BACKUP_KEY:-}
      OFFSITE_BACKUP_PREVIOUS_KEYS: ${OFFSITE_BACKUP_PREVIOUS_KEYS:-}
      OFFSITE_SYNC_MINUTES: ${OFFSITE_SYNC_MINUTES:-30}
    volumes:
      - ./backups:/backups:ro
    # Healthy while a whole pass has succeeded in the last two hours.
    healthcheck:
      test: ['CMD-SHELL', 'find /tmp/offsite-ok -mmin -120 2>/dev/null | grep -q .']
      interval: 5m
      timeout: 10s
      retries: 1
      start_period: 10m
    depends_on:
      backup: { condition: service_started }

  # One-shot: applies every migration as the database owner, with the migrate CLI that ships inside the API image.
  migrate:
    image: desk-api:${IMAGE_TAG:-local}
    pull_policy: never
    working_dir: /app
    command: ['node', 'node_modules/@crm/db/dist/cli/migrate.js', 'up']
    restart: 'no'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MIGRATION_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres: { condition: service_healthy }

  api:
    image: desk-api:${IMAGE_TAG:-local}
    pull_policy: never
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    mem_limit: 1g
    # Docker kills a container 10 s after SIGTERM by default. The API closes HTTP and websocket connections on SIGTERM; give
    # slow requests time to finish instead of cutting them off on every release.
    stop_grace_period: 30s
    logging: *app-logging
    networks: [default, dokploy-network]
    labels:
      traefik.enable: 'true'
      traefik.docker.network: dokploy-network
      traefik.http.routers.desk-api.rule: Host(`${DOMAIN}`) && (PathPrefix(`/v2`) || PathPrefix(`/socket.io`) || PathPrefix(`/health`) || PathPrefix(`/ready`) || PathPrefix(`/api/v1`) || Path(`/docs/api.json`))
      traefik.http.routers.desk-api.priority: '100'
      traefik.http.routers.desk-api.entrypoints: websecure
      traefik.http.routers.desk-api.tls.certresolver: letsencrypt
      traefik.http.services.desk-api.loadbalancer.server.port: '3000'
    environment:
      <<: *api-env
      WORKER_MODE: 'false'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      minio: { condition: service_started }

  worker:
    image: desk-api:${IMAGE_TAG:-local}
    pull_policy: never
    command: ['node', 'dist/src/worker.js']
    restart: unless-stopped
    mem_limit: 1g
    # On SIGTERM the worker stops taking jobs and waits for the running ones (BullMQ) and the current outbox batch. Killed at
    # the default 10 s, a long job is abandoned and its outbox rows stay in 'processing'.
    stop_grace_period: 60s
    logging: *app-logging
    # The image's HEALTHCHECK probes the API's HTTP port, which the worker does not serve. This one asks Redis whether the worker in
    # this container has beaten in the last three intervals (see worker-probe.ts); the release waits for it to say healthy.
    healthcheck:
      test:
        ['CMD', 'node', 'dist/src/modules/platform-infrastructure/observability/worker-probe.js']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    environment:
      <<: *api-env
      WORKER_MODE: 'true'
      DATABASE_URL: postgres://crm_worker_user:${WORKER_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_REPLICA_URL: postgres://crm_worker_user:${WORKER_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  web:
    image: desk-web:${IMAGE_TAG:-local}
    pull_policy: never
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    mem_limit: 768m
    stop_grace_period: 20s
    logging: *app-logging
    networks: [default, dokploy-network]
    labels:
      traefik.enable: 'true'
      traefik.docker.network: dokploy-network
      traefik.http.routers.desk-web.rule: Host(`${DOMAIN}`)
      traefik.http.routers.desk-web.priority: '10'
      traefik.http.routers.desk-web.entrypoints: websecure
      traefik.http.routers.desk-web.tls.certresolver: letsencrypt
      traefik.http.services.desk-web.loadbalancer.server.port: '3001'
      # Plain HTTP goes to HTTPS.
      traefik.http.routers.desk-http.rule: Host(`${DOMAIN}`)
      traefik.http.routers.desk-http.entrypoints: web
      traefik.http.routers.desk-http.middlewares: desk-https
      traefik.http.middlewares.desk-https.redirectscheme.scheme: https
    environment:
      NODE_ENV: production
      TZ: UTC
      NODE_OPTIONS: --max-old-space-size=512
      SENTRY_DSN: ${SENTRY_DSN-https://7a686f169d4a7b804e5eb7b6fdd9e806@o4507446172188672.ingest.us.sentry.io/4512202246324224}
      API_URL: http://api:3000
      REALTIME_URL: https://${DOMAIN}/realtime
    depends_on:
      - api

networks:
  dokploy-network:
    external: true

volumes:
  pgdata:
  redisdata:
  miniodata:
