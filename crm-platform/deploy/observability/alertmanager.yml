# Alertmanager for the event-loop alerts (deploy/hostinger/observability.compose.yml mounts this file).
#
# The destination is a URL kept in a compose secret (secrets/alert_webhook_url, written by observability-up.sh), so it never lands in
# git or in this file. Alertmanager POSTs its JSON notification there for every firing and resolved alert.
#
# Pointing it at a chat tool: the notification body is Alertmanager's own JSON, which Slack and Discord incoming webhooks do not accept
# directly. Either put a small relay in front, or replace the webhook receiver below with Alertmanager's native one, for Slack:
#
#   receivers:
#     - name: default
#       slack_configs:
#         - api_url_file: /run/secrets/alert_webhook_url
#           channel: '#alerts'
#           send_resolved: true
#           title: '{{ .CommonLabels.alertname }} ({{ .Status }})'
#           text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ "\n" }}{{ end }}'
#
# PagerDuty (routing key in the secret file): `pagerduty_configs: [{ routing_key_file: /run/secrets/alert_webhook_url }]`.
route:
  receiver: default
  group_by: [alertname, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: default
    webhook_configs:
      - url_file: /run/secrets/alert_webhook_url
        send_resolved: true

# A critical alert for a process makes its warnings noise.
inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [service, instance]
