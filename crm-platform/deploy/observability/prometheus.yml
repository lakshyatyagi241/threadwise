# Prometheus scrape configuration for the API and worker metrics listeners (OBS_METRICS_PORT, see
# docs/performance/event-loop/event-loop-observability-runbook.md). The job names are the ones event-loop.rules.yml expects:
# RuntimeMetricsTargetDown matches up{job=~"crm-(api|worker)"}.
#
# This file is a template for a deployment, and is what tools/event-loop-audit/scrape-demo.mjs runs against a real API and worker.
# Change `targets` to the container names (api:9464, worker:9464) and keep the token out of the file: it is read from a file.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/event-loop.rules.yml

scrape_configs:
  - job_name: crm-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics-token
    static_configs:
      - targets: ['host.docker.internal:9464']

  - job_name: crm-worker
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics-token
    static_configs:
      - targets: ['host.docker.internal:9465']
