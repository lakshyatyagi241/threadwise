# Unit tests for event-loop.rules.yml. Run with promtool (the image the repo already uses elsewhere has it):
#
#   docker run --rm -v "<repo>/crm-platform/deploy/observability:/rules" --entrypoint promtool prom/prometheus:v2.55.0 \
#     test rules /rules/event-loop.rules.test.yml
#
# Each critical alert has a case where it must fire and a near-miss where it must not: the standard says a busy loop is not a
# blocked loop, and that paging needs user impact as well as delay. Synthetic series only; nothing here says how a real process
# behaves.
rule_files:
  - event-loop.rules.yml

evaluation_interval: 1m

tests:
  # ---- API: sustained delay AND slow requests pages --------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'crm_event_loop_delay_p95_seconds{service="api",instance="a:1"}'
        values: '0.08x15'
      - series: 'crm_http_request_duration_seconds_bucket{service="api",instance="a:1",le="0.5"}'
        values: '0x15'
      - series: 'crm_http_request_duration_seconds_bucket{service="api",instance="a:1",le="1"}'
        values: '0x15'
      - series: 'crm_http_request_duration_seconds_bucket{service="api",instance="a:1",le="2.5"}'
        values: '0+100x15'
      - series: 'crm_http_request_duration_seconds_bucket{service="api",instance="a:1",le="+Inf"}'
        values: '0+100x15'
    alert_rule_test:
      - eval_time: 3m
        alertname: EventLoopBlockingWithImpact
        exp_alerts: [] # degraded for under the 5 m window: pending, not firing
      - eval_time: 12m
        alertname: EventLoopBlockingWithImpact
        exp_alerts:
          - exp_labels:
              severity: critical
              service: api
              instance: 'a:1'
            exp_annotations:
              summary: 'API event loop blocked and request p95 over 500 ms on a:1'
              description: 'Sustained loop delay with slow requests. Capture a CPU profile (runbook, section Capture evidence) before restarting.'

  # ---- API: delay without impact warns but does not page ---------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'crm_event_loop_delay_p95_seconds{service="api",instance="a:1"}'
        values: '0.08x15'
      - series: 'crm_http_request_duration_seconds_bucket{service="api",instance="a:1",le="0.05"}'
        values: '0+100x15'
      - series: 'crm_http_request_duration_seconds_bucket{service="api",instance="a:1",le="0.5"}'
        values: '0+100x15'
      - series: 'crm_http_request_duration_seconds_bucket{service="api",instance="a:1",le="+Inf"}'
        values: '0+100x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: EventLoopBlockingWithImpact
        exp_alerts: []
      - eval_time: 12m
        alertname: EventLoopDelayP95Warning
        exp_alerts:
          - exp_labels:
              severity: warning
              service: api
              instance: 'a:1'
            exp_annotations:
              summary: 'Event-loop p95 above 20 ms for 5 min on api a:1'
              description: 'Scheduling delay p95 80ms. Check the blocked-loop log lines for the slowest routes of the window.'

  # ---- a busy but responsive loop warns on utilization only ------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'crm_event_loop_utilization_ratio{service="api",instance="a:1"}'
        values: '0.95x15'
      - series: 'crm_event_loop_delay_p95_seconds{service="api",instance="a:1"}'
        values: '0.012x15'
      - series: 'crm_event_loop_delay_p99_seconds{service="api",instance="a:1"}'
        values: '0.02x15'
      - series: 'crm_http_request_duration_seconds_bucket{service="api",instance="a:1",le="0.5"}'
        values: '0+100x15'
      - series: 'crm_http_request_duration_seconds_bucket{service="api",instance="a:1",le="+Inf"}'
        values: '0+100x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: EventLoopUtilizationHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              service: api
              instance: 'a:1'
            exp_annotations:
              summary: 'Event-loop utilization above 85% for 5 min on api a:1'
              description: 'High utilization with low delay is a busy but responsive loop: capacity headroom, not a defect. It pages only together with delay (EventLoopBlockingWithImpact).'
      - eval_time: 12m
        alertname: EventLoopBlockingWithImpact
        exp_alerts: []
      - eval_time: 12m
        alertname: EventLoopDelayP95Warning
        exp_alerts: []
      - eval_time: 12m
        alertname: EventLoopDelayP99Warning
        exp_alerts: []

  # ---- worker: delay AND queue wait pages ------------------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'crm_event_loop_delay_p99_seconds{service="worker",instance="w:1"}'
        values: '0.2x15'
      - series: 'crm_queue_job_wait_seconds_bucket{service="worker",instance="w:1",queue="waba-ingest",le="15"}'
        values: '0x15'
      - series: 'crm_queue_job_wait_seconds_bucket{service="worker",instance="w:1",queue="waba-ingest",le="60"}'
        values: '0x15'
      - series: 'crm_queue_job_wait_seconds_bucket{service="worker",instance="w:1",queue="waba-ingest",le="300"}'
        values: '0+10x15'
      - series: 'crm_queue_job_wait_seconds_bucket{service="worker",instance="w:1",queue="waba-ingest",le="+Inf"}'
        values: '0+10x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: WorkerEventLoopBlockingWithQueueImpact
        exp_alerts:
          - exp_labels:
              severity: critical
              service: worker
              instance: 'w:1'
            exp_annotations:
              summary: 'Worker event loop blocked and job wait p95 over 30 s'

  # ---- worker: delay with a fast queue does not page -------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'crm_event_loop_delay_p99_seconds{service="worker",instance="w:1"}'
        values: '0.2x15'
      - series: 'crm_queue_job_wait_seconds_bucket{service="worker",instance="w:1",queue="waba-ingest",le="0.05"}'
        values: '0+10x15'
      - series: 'crm_queue_job_wait_seconds_bucket{service="worker",instance="w:1",queue="waba-ingest",le="+Inf"}'
        values: '0+10x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: WorkerEventLoopBlockingWithQueueImpact
        exp_alerts: []

  # ---- heap: warning at 75 %, critical at 90 %, nothing when comfortable ----------------------------------------------
  - interval: 1m
    input_series:
      - series: 'crm_process_heap_used_bytes{service="api",instance="a:1"}'
        values: '950000000x20'
      - series: 'crm_process_heap_limit_bytes{service="api",instance="a:1"}'
        values: '1000000000x20'
      - series: 'crm_process_heap_used_bytes{service="worker",instance="w:1"}'
        values: '500000000x20'
      - series: 'crm_process_heap_limit_bytes{service="worker",instance="w:1"}'
        values: '1000000000x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: HeapNearOom
        exp_alerts:
          - exp_labels:
              severity: critical
              service: api
              instance: 'a:1'
            exp_annotations:
              summary: 'Heap above 90% of the limit on api a:1: OOM risk'
      - eval_time: 15m
        alertname: ProcessHeapNearLimit
        exp_alerts:
          - exp_labels:
              severity: warning
              service: api
              instance: 'a:1'
            exp_annotations:
              summary: 'Heap above 75% of the limit on api a:1'

  # ---- GC pauses and cgroup throttling -----------------------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'crm_gc_pause_max_seconds{service="api",instance="a:1"}'
        values: '0.2x15'
      - series: 'crm_container_cpu_throttled_seconds_total{service="api",instance="a:1"}'
        values: '0+12x15' # 12 s of throttling per minute = 0.2 s per second
      - series: 'crm_container_cpu_throttled_seconds_total{service="worker",instance="w:1"}'
        values: '0+0.3x15' # 5 ms per second: below the threshold
    alert_rule_test:
      - eval_time: 12m
        alertname: GcPauseHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              service: api
              instance: 'a:1'
            exp_annotations:
              summary: 'GC pauses above 100 ms in the last 5 min on api a:1'
      - eval_time: 12m
        alertname: ContainerCpuThrottled
        exp_alerts:
          - exp_labels:
              severity: warning
              service: api
              instance: 'a:1'
            exp_annotations:
              summary: 'cgroup is throttling api a:1 (over 100 ms of throttle per second)'

  # ---- the monitor itself: a frozen heartbeat pages, a live one does not ------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'crm_runtime_last_report_timestamp_seconds{service="worker",instance="w:1"}'
        values: '0+60x5 300x20' # the window stops completing after 5 minutes but the process is still scraped
      - series: 'crm_runtime_last_report_timestamp_seconds{service="api",instance="a:1"}'
        values: '0+60x25'
    alert_rule_test:
      - eval_time: 6m
        alertname: RuntimeMetricsStale
        exp_alerts: [] # stale for under the 2 m hold
      - eval_time: 12m
        alertname: RuntimeMetricsStale
        exp_alerts:
          - exp_labels:
              severity: critical
              service: worker
              instance: 'w:1'
            exp_annotations:
              summary: 'worker w:1 stopped reporting runtime metrics'
              description: 'The monitor window stopped completing. A loop blocked for over a minute looks exactly like this; check the process before the scrape.'

  # ---- scrape failing -----------------------------------------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'up{job="crm-api",instance="a:1"}'
        values: '1x5 0x15'
      - series: 'up{job="crm-worker",instance="w:1"}'
        values: '1x20'
      - series: 'up{job="node-exporter",instance="host:9100"}'
        values: '0x20' # not ours: must not page
    alert_rule_test:
      - eval_time: 10m
        alertname: RuntimeMetricsTargetDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: crm-api
              instance: 'a:1'
            exp_annotations:
              summary: 'Metrics scrape of crm-api a:1 failing'
