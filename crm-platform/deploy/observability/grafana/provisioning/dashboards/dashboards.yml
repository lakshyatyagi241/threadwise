# Loads the four dashboards in this repo (../../dashboards/*.json, generated by tools/event-loop-audit/dashboards/build.mjs).
# They are read-only in the UI on purpose: change the generator, run it, commit the JSON.
apiVersion: 1
providers:
  - name: threadwise-event-loop
    orgId: 1
    folder: Threadwise
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana/dashboards
