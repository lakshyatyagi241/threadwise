# Three Google Chat spaces (critical, slowquery, deploy). The webhook URLs are secrets: they come from docker secret files mounted into the Grafana container, never from git.
apiVersion: 1
# The old `other` space was renamed to `slowquery` (Slow Queries & Warnings). Purge the stale gchat-other contact point from Grafana's database.
deleteContactPoints:
  - orgId: 1
    uid: gchat-other
contactPoints:
  - orgId: 1
    name: gchat-critical
    receivers:
      - uid: gchat-critical
        type: googlechat
        settings:
          url: $__file{/run/secrets/gchat_critical_url}
          title: '{{ template "gchat.title" . }}'
          message: '{{ template "gchat.message" . }}'
  - orgId: 1
    name: gchat-slowquery
    receivers:
      - uid: gchat-slowquery
        type: googlechat
        settings:
          url: $__file{/run/secrets/gchat_slowquery_url}
          title: '{{ template "gchat.title" . }}'
          message: '{{ template "gchat.message" . }}'
  - orgId: 1
    name: gchat-deploy
    receivers:
      - uid: gchat-deploy
        type: googlechat
        settings:
          url: $__file{/run/secrets/gchat_deploy_url}
          title: '{{ template "gchat.title" . }}'
          message: '{{ template "gchat.message" . }}'
