# Four Google Chat spaces. The webhook URLs are secrets: they come from environment variables of the Grafana container, never from git.
apiVersion: 1
contactPoints:
  - orgId: 1
    name: gchat-critical
    receivers:
      - uid: gchat-critical
        type: googlechat
        settings:
          url: $__file{/run/secrets/gchat_critical_url}
          title: '{{ template "gchat.title" . }}'
          message: '{{ template "gchat.message" . }}'
  - orgId: 1
    name: gchat-other
    receivers:
      - uid: gchat-other
        type: googlechat
        settings:
          url: $__file{/run/secrets/gchat_other_url}
          title: '{{ template "gchat.title" . }}'
          message: '{{ template "gchat.message" . }}'
  - orgId: 1
    name: gchat-slowquery
    receivers:
      - uid: gchat-slowquery
        type: googlechat
        settings:
          url: $__file{/run/secrets/gchat_slowquery_url}
          title: '{{ template "gchat.title" . }}'
          message: '{{ template "gchat.message" . }}'
  - orgId: 1
    name: gchat-deploy
    receivers:
      - uid: gchat-deploy
        type: googlechat
        settings:
          url: $__file{/run/secrets/gchat_deploy_url}
          title: '{{ template "gchat.title" . }}'
          message: '{{ template "gchat.message" . }}'
