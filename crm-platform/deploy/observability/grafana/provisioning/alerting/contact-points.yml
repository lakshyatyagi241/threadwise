# Three Google Chat spaces (critical, other, deploy). The webhook URLs are secrets: they come from docker secret files mounted into the Grafana container, never from git.
apiVersion: 1
# The fourth space (slow queries) was dropped: slow queries go to `other` and escalate to `critical`. Purge it from Grafana's database.
deleteContactPoints:
  - orgId: 1
    uid: gchat-slowquery
contactPoints:
  - orgId: 1
    name: gchat-critical
    receivers:
      - uid: gchat-critical
        type: googlechat
        settings:
          url: $__file{/run/secrets/gchat_critical_url}
          title: '{{ template "gchat.title" . }}'
          message: '{{ template "gchat.message" . }}'
  - orgId: 1
    name: gchat-other
    receivers:
      - uid: gchat-other
        type: googlechat
        settings:
          url: $__file{/run/secrets/gchat_other_url}
          title: '{{ template "gchat.title" . }}'
          message: '{{ template "gchat.message" . }}'
  - orgId: 1
    name: gchat-deploy
    receivers:
      - uid: gchat-deploy
        type: googlechat
        settings:
          url: $__file{/run/secrets/gchat_deploy_url}
          title: '{{ template "gchat.title" . }}'
          message: '{{ template "gchat.message" . }}'
