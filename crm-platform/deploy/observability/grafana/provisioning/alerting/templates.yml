apiVersion: 1
templates:
  - orgId: 1
    name: gchat
    template: |
      {{ define "gchat.title" }}[{{ if eq .Status "firing" }}FIRING{{ else }}RESOLVED{{ end }}] {{ with index .Alerts 0 }}{{ .Annotations.summary }}{{ end }}{{ if gt (len .Alerts) 1 }} ({{ len .Alerts }} alerts){{ end }}{{ end }}
      {{ define "gchat.message" }}{{ range .Alerts }}Severity: {{ or .Labels.severity "none" }}
      Query duration: {{ or .Annotations.duration "see description" }}
      {{ .Annotations.description }}
      Runbook: {{ or .Annotations.runbook_url "n/a" }}
      {{ end }}{{ end }}
