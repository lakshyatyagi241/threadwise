# Alertmanager with the NATIVE PagerDuty receiver (EL-B14). Chosen by observability-up.sh when the destination type is "pagerduty"; the
# file the secret holds is the Events API v2 integration (routing) key, not a URL. Critical alerts page; warnings are sent as well
# (PagerDuty's own routing decides who is woken). Checked with amtool in CI; not verified against a live PagerDuty service here.
route:
  receiver: default
  group_by: [alertname, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: default
    pagerduty_configs:
      - routing_key_file: /run/secrets/alert_webhook_url
        send_resolved: true
        severity: '{{ if eq .CommonLabels.severity "critical" }}critical{{ else }}warning{{ end }}'
        description: '{{ .CommonLabels.alertname }}: {{ .CommonAnnotations.summary }}'

# A critical alert for a process makes its warnings noise.
inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [service, instance]
