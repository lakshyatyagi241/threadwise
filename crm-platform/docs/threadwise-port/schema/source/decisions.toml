[map.api_keys]
prefix = "api_keys.key_prefix"
key_hash = "api_keys.key_hash"
workspace_id = "api_keys.org_id"
scopes = "api_keys.scopes (text[])"

[map.attributes]
_default = "fields (ADR-0017 field metadata registry): attribute_key -> fields.key, attribute_name -> fields.label, type -> fields.field_type, status -> fields.is_active, attribute_value and description -> fields.config"

[map.contact_custom_fields]
_default = "fields (ADR-0017): key -> key, label -> label, type -> field_type, required -> is_required, sort -> position, options -> field_options rows, show_in_panel -> config"

[map.roles]
_default = "roles (per-org rows seeded from the presets) / permission_defs for the platform-level names; RBAC domain maps Reference's 101 keys"

[map.permissions]
_default = "permission_defs (global capability registry): Reference permission names become <code>.<resource>.<action> keys seeded by the RBAC domain"

[map.model_has_roles]
_default = "user_roles (model_type is always the user model)"

[map.model_has_permissions]
_default = "role_grants (direct user permissions become a per-user role)"

[map.role_has_permissions]
_default = "role_grants (effect allow, record_scope all unless the feature scopes it)"

[map.system_settings]
created_at = "(dropped: platform_settings tracks updated_at and updated_by only)"
