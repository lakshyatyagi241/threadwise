# Judgement calls for the Reference -> crm-platform schema translation.
# Everything the generator cannot derive from the Reference schema itself lives here, so a reviewer
# can read and change decisions in one place and re-run the generator. See docs/threadwise-port/schema/README.md.

[meta]
first_migration_stamp = "20261001100000"   # after 20261001090000_auth_core; one minute apart, in dependency order
partition_months_back = 1
partition_months_ahead = 2
# financial/audit-critical domains: a NOT NULL reference to a tenant row blocks the parent delete instead of cascading
user_owned_cascade = ["user_settings"]
restrict_domains = ["inv", "wallet", "paygw", "plan", "chk", "sales", "bsp", "cpn"]

# --- table -> domain (slug from ownership.json). Every one of the 227 Reference tables appears exactly once. ---
[domain]
"auth-registration-security" = ["user_otps", "sessions", "password_reset_tokens", "personal_access_tokens", "security_audit_log", "users"]
"workspaces-teams-tenancy" = ["workspaces", "workspace_user", "teams", "team_user", "user_device_tokens", "workspace_addons", "workspace_email_accounts", "workspace_flags", "workspace_ig_accounts", "workspace_payment_configs", "impersonation_sessions"]
"roles-permissions" = ["roles", "permissions", "model_has_roles", "model_has_permissions", "role_has_permissions"]
"platform-settings-branding-storage" = ["system_settings"]
"localization-translation" = ["languages", "translation_providers", "translation_usage"]
"platform-infrastructure" = ["cache", "cache_locks", "jobs", "job_batches", "failed_jobs", "migrations"]
