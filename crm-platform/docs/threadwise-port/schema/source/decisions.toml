"channel-viber" = ["viber_channels", "viber_broadcasts", "viber_broadcast_recipients", "viber_flow_sessions"]
"integrations-hubspot-slack-trello-google-webhooks" = ["hubspot_integrations", "hubspot_integration_logs", "slack_integrations", "slack_integration_logs", "trello_integrations", "trello_integration_logs", "webhooks", "webhook_deliveries", "incoming_webhooks", "incoming_webhook_events"]
"developer-rest-api-v1" = ["api_keys"]

# --- table classes (anything not listed here with a workspace_id is a plain tenant table; without one, a tenant child) ---
[class]
# Laravel plumbing replaced by the platform (BullMQ, Redis, the auth_core session/token tables, migration journal).
drop = { cache = "Laravel cache store: Redis here", cache_locks = "Laravel cache locks: Redis here", jobs = "Laravel queue: BullMQ", job_batches = "Laravel queue batches: BullMQ", failed_jobs = "Laravel failed jobs: BullMQ failed set + dead outbox rows", migrations = "Laravel migration journal: _migrations", password_reset_tokens = "auth_core user_tokens", sessions = "auth_core auth_sessions", personal_access_tokens = "api_keys + auth_core user_tokens", user_otps = "auth_core user_tokens (kind otp)", message_charges = "renamed usage_charges (ADR-0012 level-1 ledger), see [virtual.usage_charges]" }

# Reference table that is the same thing as a table this repo already has. Not generated: overlays/*.sql adds only what is missing.
existing = { users = "users + user_profiles (auth_core)", workspaces = "organizations (+ workspace_settings overlay)", workspace_user = "users + user_roles", teams = "teams", team_user = "team_members", roles = "roles", permissions = "permission_defs", model_has_roles = "user_roles", model_has_permissions = "role_grants", role_has_permissions = "role_grants", api_keys = "api_keys", contacts = "contacts", companies = "companies", tags = "tags", contact_tag = "contact_tags", attributes = "fields (field metadata registry, ADR-0017)", contact_custom_fields = "fields (field metadata registry, ADR-0017)", system_settings = "platform_settings (auth_core)", security_audit_log = "security_events (auth_core)", audit_logs = "audit_log" }

# Platform catalogue, no org_id. Any tenant may read; only the privileged (operator/worker) role may write.
global_read = ["languages", "currencies", "packages", "package_features", "message_rates", "credit_packages", "pricing_faqs", "legal_pages", "guidebook_articles", "announcements", "blog_categories", "blog_posts", "flow_templates", "frontend_content"]

# Platform-operator data, no org_id. Invisible to tenant transactions (policy satisfied only by app_is_privileged()).
platform_only = ["admin_ai_keys", "payment_gateways", "coupons", "translation_providers", "extensions", "contact_messages", "impersonation_sessions", "referrals", "invoice_webhook_events"]

# Append-only streams: RANGE partitioned monthly, PK (id, <key>), explicit sequence, no FK in or out. value = partition key column.
[streams]
messages = "created_at"
inbox_messages = "created_at"
conversation_events = "created_at"
flow_retry_logs = "created_at"
keyword_reply_logs = "fired_at"
hubspot_integration_logs = "created_at"
slack_integration_logs = "created_at"
trello_integration_logs = "created_at"
shopify_integration_logs = "created_at"
woocommerce_integration_logs = "created_at"
invoice_logs = "created_at"
incoming_webhook_events = "received_at"
webhook_deliveries = "fired_at"
wa_call_events = "received_at"
wa_link_clicks = "created_at"
ai_call_logs = "created_at"
ai_token_usage = "created_at"
translation_usage = "created_at"

# --- virtual tables ---------------------------------------------------------------------------------------------------
# workspaces is the tenant itself (organizations). Its name/slug/plan/status live there; every other workspace column is a
# per-tenant setting and goes to a 1:1 extension table so `organizations` (a kernel table) stays small.
[virtual.workspace_settings]
domain = "workspaces-teams-tenancy"
from = "workspaces"
skip = ["name", "slug", "plan", "status"]
unique_org = true
why = "1:1 with organizations: the Reference workspaces columns that are not name/slug/plan/status"

# contacts.contact_group is an encrypted JSON array of group ids in Reference; a join table gives it real foreign keys.
[virtual.contact_group_members]
domain = "contacts-attributes-tags"
columns = [ { name = "contact_id" }, { name = "group_id" } ]
unique = [["contact_id", "group_id"]]
index = [["group_id"]]
why = "normalises Reference contacts.contact_group (JSON list of contact_groups ids)"

# --- relation overrides: "table.column" = "threadwise table" | "none" (loose: polymorphic or external id) --------------------
[relations]
"referral_codes.owner_org_id" = "workspaces"
"referral_codes.user_id" = "none"
"user_settings.user_id" = "users"
"workspace_settings.default_voice_ai_agent_id" = "ai_agents"
"contact_group_members.contact_id" = "contacts"
"contact_group_members.group_id" = "contact_groups"
"notifications.source_id" = "none"
"scheduled_messages.campaign_id" = "wpcampaigns"
"wa_link_clicks.campaign_id" = "wpcampaigns"
"wa_pending_orders.order_id" = "wa_orders"
"wa_product_reviews.order_id" = "wa_orders"
"wa_stock_reservations.order_id" = "wa_orders"
"impersonation_sessions.original_workspace_id" = "workspaces"

# ADR-0012 level-1 ledger: one row per billable unit, partitioned, rate frozen at charge time. Same columns as Reference message_charges.
[virtual.usage_charges]
domain = "wallet-message-billing"
from = "message_charges"
stream_key = "created_at"
why = "Reference message_charges under the name ADR-0012 gives the level-1 ledger"

# ADR-0012 wallet: balance and reserved, invariant enforced by CHECK. Reference keeps two balances on users (wallet_credits for
# message credits, wallet_currency_minor + wallet_currency_code for money); here that is one row per (org, unit).
[virtual.wallets]
domain = "wallet-message-billing"
why = "ADR-0012 prepaid wallet. unit is 'credits' or an ISO currency code. Replaces users.wallet_credits / wallet_currency_minor / wallet_currency_code"
columns = [
  { name = "unit", ctype = "varchar(16)", nullable = false },
  { name = "balance", ctype = "decimal(20,4)", nullable = false, default = "0" },
  { name = "reserved", ctype = "decimal(20,4)", nullable = false, default = "0" },
]
unique = [["unit"]]
checks = [ { name = "chk_wallet_invariant", sql = "balance >= 0 AND reserved >= 0 AND reserved <= balance" } ]

# ADR-0012: wallet_transactions carries a real unique (org_id, idempotency_key) so a gateway retry cannot double-post.
[extra.wallet_transactions]
columns = [ { name = "idempotency_key", ctype = "varchar(191)", nullable = false } ]
unique = [["idempotency_key"]]

# users.* columns that auth_core's user_profiles/user_security do not carry. 1:1 with users.
[virtual.user_settings]
domain = "auth-registration-security"
why = "per-user Reference columns with no home in auth_core: postal address, onboarding/UI state, Sheets add-on key"
columns = [
  { name = "user_id" },
  { name = "address", ctype = "text", nullable = true },
  { name = "city", ctype = "varchar(255)", nullable = true },
  { name = "state", ctype = "varchar(255)", nullable = true },
  { name = "country", ctype = "varchar(255)", nullable = true },
  { name = "zip", ctype = "varchar(255)", nullable = true },
  { name = "country_code", ctype = "varchar(255)", nullable = true },
  { name = "notes", ctype = "text", nullable = true },
  { name = "welcome_email_sent_at", ctype = "timestamp", nullable = true },
  { name = "auto_ai_summarize_enabled", ctype = "tinyint(1)", nullable = false, default = "0" },
  { name = "inbox_last_seen_at", ctype = "timestamp", nullable = true },
  { name = "quick_access", ctype = "longtext", nullable = true },
  { name = "has_seen_intro", ctype = "tinyint(1)", nullable = false, default = "0" },
  { name = "sheets_key_hash", ctype = "varchar(64)", nullable = true },
  { name = "sheets_key_suffix", ctype = "varchar(16)", nullable = true },
  { name = "sheets_key_created_at", ctype = "timestamp", nullable = true },
  { name = "sheets_key_last_used_at", ctype = "timestamp", nullable = true },
]
unique = [["user_id"]]
index = [["sheets_key_hash"]]
unique_org = false

# users.referral_code: entered at signup, before any tenant context exists, so the lookup table is platform-level.
[virtual.referral_codes]
domain = "coupons-credits-referral-currency"
class = "platform_only"
why = "Reference users.referral_code; looked up by code at signup before an org is known"
columns = [
  { name = "owner_org_id" },
  { name = "user_id" },
  { name = "code", ctype = "varchar(64)", nullable = false },
]
unique = [["code"]]

# --- column maps for Reference tables that already exist here (or were dropped): column -> where it lives ----------------------
# A column not listed maps to the same name on the target table when that exists; the table-map doc flags anything left over.
[map.users]
id = "users.id (new identity; Reference ids only matter to the data migration)"
name = "users.full_name"
display_name = "user_profiles.display_name"
email = "users.email"
locale = "user_profiles.locale"
site_name = "organizations.slug (the workspace site slug Reference generates at signup)"
referral_code = "referral_codes.code"
referred_by_user_id = "referrals.referrer_user_id (cross-org, loose)"
wallet_credits = "wallets.balance where unit = 'credits'"
wallet_currency_minor = "wallets.balance where unit = the currency code (minor units become a numeric amount)"
wallet_currency_code = "wallets.unit"
mobile = "user_profiles.phone_e164"
mobile_verified_at = "user_profiles.phone_verified_at"
address = "user_settings.address"
city = "user_settings.city"
state = "user_settings.state"
country = "user_settings.country"
zip = "user_settings.zip"
notes = "user_settings.notes"
country_code = "user_settings.country_code"
force_password_change = "user_security.force_password_change"
welcome_email_sent_at = "user_settings.welcome_email_sent_at"
avatar_path = "user_avatars (bytes for now, object storage when the storage adapter lands)"
role = "user_roles -> roles (admin / manager / agent presets)"
email_verified_at = "user_security.email_verified_at"
password = "users.password_hash"
passcode = "(dropped: legacy PIN, replaced by two-factor in Reference itself)"
password_changed_at = "user_security.password_changed_at"
social_provider = "social_identities.provider"
social_provider_id = "social_identities.subject"
two_factor_enabled = "user_security.mfa_enabled"
two_factor_secret = "user_security.mfa_secret_enc"
two_factor_confirmed_at = "user_security.mfa_confirmed_at"
two_factor_recovery_codes = "user_security.mfa_recovery_hashes"
theme_preference = "user_profiles.theme"
auto_ai_summarize_enabled = "user_settings.auto_ai_summarize_enabled"
remember_token = "(dropped: Laravel remember-me cookie, replaced by auth_sessions)"
inbox_last_seen_at = "user_settings.inbox_last_seen_at"
current_workspace_id = "(dropped: a user belongs to exactly one org)"
quick_access = "user_settings.quick_access"
has_seen_intro = "user_settings.has_seen_intro"
sheets_api_key_hash = "user_settings.sheets_key_hash"
sheets_api_key_suffix = "user_settings.sheets_key_suffix"
sheets_api_key_created_at = "user_settings.sheets_key_created_at"
sheets_api_key_last_used_at = "user_settings.sheets_key_last_used_at"
deleted_at = "(dropped: hard delete + audit row, ADR-0009)"

[map.workspaces]
id = "organizations.id"
name = "organizations.name"
slug = "organizations.slug"
plan = "organizations.plan"
status = "organizations.status ('active' / 'suspended')"
deleted_at = "(dropped: hard delete + audit row, ADR-0009)"
_default = "workspace_settings.<same column>"

[map.workspace_user]
id = "(dropped: membership is the users row itself)"
workspace_id = "users.org_id"
user_id = "users.id"
role = "user_roles -> roles"
invited_at = "users.invited_at"
joined_at = "users.joined_at"

[map.teams]
workspace_id = "teams.org_id"
default_assignee_user_id = "teams.default_assignee_id"
deleted_at = "(dropped: hard delete + audit row, ADR-0009)"

[map.team_user]
created_at = "(dropped: team_members rows carry no timestamps)"
updated_at = "(dropped: team_members rows carry no timestamps)"
id = "(dropped: team_members is keyed by (org_id, team_id, user_id))"
is_lead = "team_members.is_lead"
capacity = "team_members.capacity"

[map.tags]
workspace_id = "tags.org_id"
slug = "(dropped: derived from name)"
description = "tags.description"

[map.contact_tag]
updated_at = "(dropped: join rows are not updated)"
id = "(dropped: contact_tags is keyed by (org_id, contact_id, tag_id))"
