# --- stream vs regular, changed after reviewers read how the code uses each table ---------------------------------------------
[stream_changes]
ai_call_logs = "regular"            # inserted at connect, updated on terminate/recording; wa_calls points at it
wa_link_clicks = "regular"          # tracked-link row looked up by token and updated on every click
flow_retry_logs = "regular"         # inserted queued, then updated with the outcome
incoming_webhook_events = "regular" # updated right after insert; receiver keeps only the newest 100 per hook
ai_crm_actions = "created_at"       # insert-only audit of AI copilot tool calls
auto_reply_lookups = "created_at"   # insert-only, one row per inbound keyword lookup

[json]
user_settings = ["quick_access"]

# --- child tables: which column is the tenancy parent. "org" = org_id alone (the natural parent is polymorphic) ---------------
[parent]
keyword_reply_contents = "keyword_reply_id"
team_chat_channel_members = "channel_id"
warmer_daily_sends = "org"   # device_id is a devices id for the Baileys engine and a wa_provider_configs id for Cloud API: no single parent

# --- uniqueness that stays global ---------------------------------------------------------------------------------------------
# A Reference unique key without workspace_id is made per tenant here (a value another tenant already holds must not block this one,
# and the conflict would leak that it exists). Only values the platform issues, or provider ids that identify one remote object
# and are looked up before any tenant context exists, stay globally unique.
[global_unique]
keys = [
  "appointments.manage_token", "chatbot_widgets.embed_token", "crm_briefs.public_token", "incoming_webhooks.token",
  "invoices.public_token", "sales_docs.public_token", "google_form_sessions.webhook_token", "line_channels.webhook_token",
  "telegram_bots.webhook_token", "viber_channels.webhook_token", "wechat_channels.webhook_token", "wa_chat_links.slug",
  "wa_storefronts.slug", "wa_storefronts.custom_domain", "orders.order_number", "support_tickets.ticket_number",
  "user_device_tokens.token_hash", "push_subscriptions.endpoint_hash", "chatbot_widget_visitors.visitor_uuid",
  "wa_calls.correlation_id", "wa_calls.meta_call_id", "ai_call_logs.twilio_call_sid", "wa_templates.meta_template_id",
  "slack_integrations.team_id", "wa_link_clicks.token",
]

# --- column type overrides --------------------------------------------------------------------------------------------------
# ADR-0012: money in the wallet and its ledger is numeric and stays a string end to end. Reference keeps integer credits / minor units
# here; the ledger follows the ADR so it can be summed against wallets.balance without a unit change. Other *_minor columns keep
