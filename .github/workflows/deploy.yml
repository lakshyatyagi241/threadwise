name: Deploy desk.wabo.ai

# Every push to main that touches crm-platform runs the API unit tests, builds the two images on the runner (the host is shared
# and has little spare RAM, so it never builds), ships them over SSH with a key that can only run deploy/hostinger/ci-entry.sh,
# migrates, restarts, health-checks, and rolls back to the previous release if the API does not become ready.
# Manual run: Actions > Deploy desk.wabo.ai > Run workflow.
on:
  push:
    branches: [main]
    paths: ['crm-platform/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

concurrency:
  group: deploy-desk
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEPLOY_USER: root

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: crm-platform
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@9.15.4 --activate
      - uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ hashFiles('crm-platform/pnpm-lock.yaml') }}
          restore-keys: pnpm-
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @crm/tax build && pnpm --filter @crm/contracts build && pnpm --filter @crm/db build && pnpm --filter @crm/observability build
      - run: pnpm --filter @crm/api test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    steps:
      - uses: actions/checkout@v7

      - id: tag
        run: echo "tag=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: crm-platform
          file: crm-platform/apps/api/Dockerfile
          tags: desk-api:${{ steps.tag.outputs.tag }}
          load: true
          build-args: |
            GIT_SHA=${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: crm-platform
          file: crm-platform/apps/web/Dockerfile
          tags: desk-web:${{ steps.tag.outputs.tag }}
          load: true
          # The DSN is public by design (it only lets events in). Source maps upload only if the SENTRY_AUTH_TOKEN secret and the
          # SENTRY_ORG / SENTRY_PROJECT variables are set in the repository; until then they are empty and nothing is uploaded.
          build-args: |
            NEXT_PUBLIC_SENTRY_DSN=https://7a686f169d4a7b804e5eb7b6fdd9e806@o4507446172188672.ingest.us.sentry.io/4512202246324224
            NEXT_PUBLIC_GIT_SHA=${{ steps.tag.outputs.tag }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      # QA task 39: the images that are about to ship are scanned first; a fixable HIGH or CRITICAL finding stops the release.
      - name: Scan the images before they ship
        run: |
          for image in "desk-api:${{ steps.tag.outputs.tag }}" "desk-web:${{ steps.tag.outputs.tag }}"; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/.trivyignore:/.trivyignore:ro" \
              aquasec/trivy:0.75.0 image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --ignorefile /.trivyignore "$image"
          done

      - name: Prepare SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CFG
          Host desk
            HostName ${{ secrets.DEPLOY_HOST }}
            User ${{ env.DEPLOY_USER }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
          CFG

      - name: Sync deploy files
        run: tar -C crm-platform/deploy/hostinger -c docker-compose.yml init-roles.sh seed.js set-secrets.sh ci-entry.sh .env.example | ssh desk sync

      - name: Ship images
        run: |
          TAG=${{ steps.tag.outputs.tag }}
          docker save "desk-api:$TAG" "desk-web:$TAG" | gzip -1 | ssh desk load

      - name: Release
        run: ssh desk "release ${{ steps.tag.outputs.tag }}"

      - name: Public smoke test
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://desk.wabo.ai/ready || true)
            [ "$code" = 200 ] && { echo "ready"; exit 0; }
            sleep 5
          done
          echo "https://desk.wabo.ai/ready did not return 200" >&2; exit 1
