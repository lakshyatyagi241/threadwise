name: Mobile release

# Builds, submits or updates the mobile app with EAS (docs/adr/0026-mobile-release-and-versioning.md, docs/runbooks/mobile-release.md).
# Manual only. It spends the project's EAS quota and, for `production`, publishes to the stores' review queues, so each run waits for the
# approval of the GitHub Environment named `mobile-<profile>` (create them in Settings > Environments with required reviewers).
#
# Does nothing until the repository secret EXPO_TOKEN exists (a robot token from the Expo organisation, see
# docs/runbooks/mobile-store-setup.md) and the EAS project has been created with `eas init`.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS profile'
        type: choice
        options: [preview, production]
        required: true
      action:
        description: 'What to do'
        type: choice
        options: [build, submit-latest, update]
        required: true
      platform:
        description: 'Platform (build and submit)'
        type: choice
        options: [all, ios, android]
        default: all
      message:
        description: 'Release note (update) or label'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: mobile-release-${{ inputs.profile }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  EXPO_NO_TELEMETRY: '1'

jobs:
  release:
    name: ${{ inputs.action }} · ${{ inputs.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: mobile-${{ inputs.profile }}
    defaults:
      run:
        working-directory: crm-platform/apps/mobile
    steps:
      - name: Refuse to run without the Expo token
        working-directory: .
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then echo "::error::Repository secret EXPO_TOKEN is not set (docs/runbooks/mobile-store-setup.md)."; exit 1; fi
      - name: Production releases come from main
        if: inputs.profile == 'production' && github.ref != 'refs/heads/main'
        working-directory: .
        run: echo "::error::Production releases run from main."; exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable && corepack prepare pnpm@9.15.4 --activate
      - uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ hashFiles('crm-platform/pnpm-lock.yaml') }}
          restore-keys: pnpm-
      - run: pnpm install --frozen-lockfile
        working-directory: crm-platform
      - run: pnpm --filter @crm/tax build && pnpm --filter @crm/contracts build
        working-directory: crm-platform
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # The same gate as a PR, with the strict checks: nothing is built from a tree that does not pass it.
      - name: Quality gate
        working-directory: crm-platform
        env:
          APP_VARIANT: ${{ inputs.profile }}
          EXPO_PUBLIC_API_URL: https://api.example.invalid
        run: bash .claude/skills/mobile-pre-pr/scripts/gate.sh --full

      - name: Build
        if: inputs.action == 'build'
        run: eas build --profile ${{ inputs.profile }} --platform ${{ inputs.platform }} --non-interactive --no-wait
      - name: Submit the latest build
        if: inputs.action == 'submit-latest'
        run: eas submit --profile ${{ inputs.profile }} --platform ${{ inputs.platform }} --latest --non-interactive --no-wait
      - name: Over-the-air update
        if: inputs.action == 'update'
        env:
          # Through the environment, never interpolated into the script: the input is free text.
          RELEASE_MESSAGE: ${{ inputs.message }}
        run: eas update --channel ${{ inputs.profile }} --message "${RELEASE_MESSAGE:-mobile update}" --non-interactive
