name: Performance

# Performance runs (QA tasks 50, 51, 52, 55, 63): API latency per class with the ranked list and the regression guard, throughput capacity,
# the spike pass rule, and bytes on the wire. Manual on purpose, for the same reason as the Quality, Security and Browsers workflows:
# Actions jobs do not start on this account. Nothing in this file has run on GitHub; every step was run by hand against a native Postgres,
# Redis and API on one machine (see crm-platform/docs/quality/performance-testing.md for the numbers and for what that setup means).
# Run it on a dedicated runner only: the throughput and spike steps push the stack until it gives.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: "What to run"
        type: choice
        options: [latency, throughput, spike-http, bandwidth]
        default: latency
      write_baseline:
        description: "Replace perf/baseline.json with this run (only from a trusted main build)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  K6_VERSION: "1.4.0"

jobs:
  perf:
    name: ${{ inputs.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: crm-platform
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: crm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crm" --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://crm_app_user:crm_app_dev@localhost:5432/crm
      MIGRATION_DATABASE_URL: postgres://crm:crm@localhost:5432/crm
      REDIS_URL: redis://localhost:6379
      API_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: crm-platform/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Every API route has a latency class
        run: node tools/perf/classify.mjs --check
      - name: The perf tools' own tests
        run: node --test tools/perf/*.test.mjs
      - name: Install k6
        run: |
          curl -sSL "https://github.com/grafana/k6/releases/download/v${K6_VERSION}/k6-v${K6_VERSION}-linux-amd64.tar.gz" | sudo tar xz --strip-components=1 -C /usr/local/bin "k6-v${K6_VERSION}-linux-amd64/k6"
          k6 version
      - name: Roles, migrations, build
        run: |
          psql "postgres://crm:crm@localhost:5432/crm" -f docker/postgres/init/01-app-roles.sql
          pnpm --filter @crm/tax --filter @crm/contracts --filter @crm/db --filter @crm/observability build
          pnpm db:migrate
          pnpm --filter @crm/api build
      - name: Start the API (production mode, real secrets for this run only)
        run: |
          cp .env.example .env
          {
            echo "JWT_ACCESS_SECRET=$(openssl rand -base64 48 | tr -d '=+/\n')"
            echo "JWT_REFRESH_SECRET=$(openssl rand -base64 48 | tr -d '=+/\n')"
            echo "CREDENTIALS_ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "CHANNEL_SIMULATOR_ENABLED=false"
            echo "JWT_ACCESS_TTL=3h"
          } >> .env
          (cd apps/api && NODE_ENV=production LOG_LEVEL=warn nohup node --env-file=../../.env dist/src/main.js > /tmp/api.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf localhost:3000/health && break; sleep 2; done
      - name: Open registration for the benchmark organisation and sign it up
        run: |
          psql "$MIGRATION_DATABASE_URL" -c "INSERT INTO platform_settings (key,value,is_secret) VALUES ('registration','{\"businessEmailOnly\": false, \"blockDisposableEmail\": false, \"requirePhoneVerification\": false}'::jsonb,false) ON CONFLICT (key) DO UPDATE SET value = platform_settings.value || EXCLUDED.value"
          echo "A restart picks the registration policy up"
          pkill -x node || true
          (cd apps/api && NODE_ENV=production LOG_LEVEL=warn nohup node --env-file=../../.env dist/src/main.js > /tmp/api.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf localhost:3000/health && break; sleep 2; done
          curl -sf -X POST localhost:3000/v2/auth/signup -H 'content-type: application/json' -H 'x-forwarded-for: 10.9.0.3' \
            -d '{"orgName":"Perf Org","fullName":"Perf Admin","email":"perf1@geta.ai","password":"Str0ngPassw0rd#1","acceptTerms":true}' > /dev/null
      - name: Fill the organisation
        run: psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -f tools/perf/seed.sql
      - name: Latency (3 runs of 1 user, 3 of 20), ranked list and regression guard
        if: inputs.suite == 'latency'
        run: |
          bash tools/perf/run-latency.sh perf/results
          args=""; [ -f perf/baseline.json ] && args="--baseline perf/baseline.json"
          node tools/perf/rank.mjs perf/results/latency-vus1-run*.json --top 20 $args --out perf/results/ranked.md ${{ inputs.write_baseline && '--write-baseline perf/baseline.json' || '' }}
      - name: Throughput (stepped arrival rate)
        if: inputs.suite == 'throughput'
        run: |
          k6 run perf/throughput.js -e RATES=25,50,100,200,400 -e STEP=60 --quiet || true
          args=""; [ -f perf/baseline-throughput.json ] && args="--baseline perf/baseline-throughput.json"
          node tools/perf/capacity.mjs perf/results/throughput.json $args ${{ inputs.write_baseline && '--write-baseline perf/baseline-throughput.json' || '' }}
      - name: Spike (HTTP mix) with the sampler
        if: inputs.suite == 'spike-http'
        run: |
          PID=$(pgrep -x node | head -1)
          API_PID=$PID node tools/perf/sample.mjs perf/results/samples-http.json --seconds 780 &
          k6 run perf/spike.js -e SPIKE=http -e NORMAL=20 --quiet || true
          wait
          node tools/perf/spike-check.mjs perf/results/spike-http.json --samples perf/results/samples-http.json
      - name: Bandwidth
        if: inputs.suite == 'bandwidth'
        run: |
          TOKEN=$(curl -s -X POST localhost:3000/v2/auth/login -H 'content-type: application/json' -H 'x-forwarded-for: 10.9.0.9' -d '{"email":"perf1@geta.ai","password":"Str0ngPassw0rd#1"}' | node -e 'process.stdin.on("data",d=>console.log(JSON.parse(d).tokens.accessToken))')
          node tools/perf/bandwidth.mjs api --token "$TOKEN" --out perf/results/bandwidth-api.json --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-results-${{ inputs.suite }}
          path: |
            crm-platform/perf/results/
            /tmp/api.log
