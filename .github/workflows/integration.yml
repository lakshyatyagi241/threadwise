name: Integration

# The slow, database-backed suite (about 40 specs, each starting its own Postgres container through testcontainers).
# NOT yet a pull-request gate: it has not been run to completion in CI, and a full local run takes about 40 minutes, which on a
# private repository's free Actions minutes would be a large share of the month for every push. Run it by hand
# (Actions > Integration > Run workflow) before merging anything that touches migrations or tenant isolation; it also runs
# every Monday so a regression does not sit unnoticed. Making it a PR gate for changes under packages/db or the migrations is the
# next step once it has run green here a few times.
#
# Two specs are left out because they read a developer's local .env and a database named after a git worktree (see
# test/integration/bsp-billing-engine/live-db.ts): they cannot pass on a runner.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

concurrency:
  group: integration
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: crm-platform
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@9.15.4 --activate
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ hashFiles('crm-platform/pnpm-lock.yaml') }}
          restore-keys: pnpm-
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @crm/tax build && pnpm --filter @crm/contracts build && pnpm --filter @crm/db build
      - name: Integration (testcontainers)
        run: >-
          pnpm --filter @crm/api exec vitest run --dir test/integration --testTimeout=120000
          --exclude '**/bsp-billing-engine/allocations-schema.spec.ts'
          --exclude '**/wallet-message-billing/wallet-schema.spec.ts'
