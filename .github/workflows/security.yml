name: Security

# Security scans (QA tasks 28, 27, 39): secrets in the whole git history, known vulnerabilities in dependencies, and the two Docker images.
#
# Manual on purpose. The automatic check workflows were removed in #328 because GitHub Actions jobs do not start on this account, so
# nothing here runs on a pull request, a push or a schedule. Start it from the Actions tab when the account is paid up, or run the same
# three scans on your own machine with `bash crm-platform/tools/quality/security-scan.sh`. The release workflow (deploy.yml) still scans
# the images before they ship.
#
# The dependency rules are in crm-platform/tools/quality/audit-gate.mjs; a reviewed finding is accepted in
# crm-platform/.audit-accepted.json with a reason and an end date, and an expired entry fails the run.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1
  TRIVY_IMAGE: aquasec/trivy:0.75.0

jobs:
  secrets:
    name: Secrets in the git history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the whole history is scanned: a key that was committed and then deleted is still in it
      # Rules and the list of fake values are in .gitleaks.toml; a reviewed finding is fingerprinted in .gitleaksignore.
      # A real secret is rotated before anything else (crm-platform/docs/runbooks/key-rotation.md).
      - name: Scan the repository history
        run: |
          docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" detect --source /repo --log-opts="--all" \
            --config /repo/.gitleaks.toml --redact --no-banner --report-format json --report-path /repo/gitleaks-report.json
      - name: Keep the report when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json

  dependencies:
    name: Dependencies (audit and a second database)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: crm-platform
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable && corepack prepare pnpm@9.15.4 --activate
      - run: pnpm install --frozen-lockfile
      - name: The gate's own tests
        run: node --test tools/quality/audit-gate.test.mjs
      # Two reports: what ships (production) and everything. `pnpm audit` exits 1 when it finds anything, so the exit code is
      # ignored here and the gate decides.
      - name: Audit reports
        run: |
          mkdir -p ../security-reports
          pnpm audit --prod --json > ../security-reports/audit-prod.json || true
          pnpm audit --json > ../security-reports/audit-all.json || true
      - name: Gate (production high and critical, development critical, expired decisions)
        run: node tools/quality/audit-gate.mjs ../security-reports/audit-prod.json ../security-reports/audit-all.json
      # A second vulnerability database over the same lockfile (Trivy reads production dependencies by default).
      - name: Lockfile scan with Trivy (production, high and critical, fixes only)
        run: |
          docker run --rm -v "$PWD:/src" -v "$PWD/../security-reports:/out" "$TRIVY_IMAGE" fs --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --format json --output /out/trivy-lockfile.json /src/pnpm-lock.yaml
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-reports
          path: security-reports/

  images:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: crm-platform
          file: crm-platform/apps/api/Dockerfile
          tags: desk-api:scan
          load: true
          cache-from: type=gha,scope=api
      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: crm-platform
          file: crm-platform/apps/web/Dockerfile
          tags: desk-web:scan
          load: true
          cache-from: type=gha,scope=web
      - name: Scan the images (high and critical, fixes only)
        run: |
          mkdir -p security-reports
          for image in desk-api:scan desk-web:scan; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/.trivyignore:/.trivyignore:ro" -v "$PWD/security-reports:/out" \
              "$TRIVY_IMAGE" image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --ignorefile /.trivyignore \
              --format json --output "/out/${image%%:*}.json" "$image"
          done
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-reports
          path: security-reports/
