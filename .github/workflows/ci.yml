name: CI

# The checks pr-checks.yml does not do: lint, architecture boundaries, formatting of what the PR touches, a production
# dependency audit, and the migrations applied from scratch. (pr-checks.yml does typecheck, unit tests, the two image builds and
# the deploy-script tests; integration.yml runs the slow database-backed suite.)
#
# This file used to live at crm-platform/.github/workflows/ci.yml. GitHub only reads .github/workflows at the ROOT of the
# repository, so it never ran here (`gh workflow list` shows only "PR checks" and "Deploy"), and lint errors, a circular import
# and 21 type errors built up on main unnoticed until they were cleaned in #47.
on:
  pull_request:
    branches: [main]
    paths: ['crm-platform/**', '.github/workflows/ci.yml']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  static:
    name: Lint · architecture · formatting · audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: crm-platform
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the formatting check diffs against the base branch
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable && corepack prepare pnpm@9.15.4 --activate
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ hashFiles('crm-platform/pnpm-lock.yaml') }}
          restore-keys: pnpm-
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @crm/tax build && pnpm --filter @crm/contracts build && pnpm --filter @crm/db build

      # @crm/api's type-aware ESLint runs out of the default Node heap on a runner (exit 134, "Aborted (core dumped)" after ~4 min;
      # it passes on a laptop with more headroom). A runner has about 7 GB.
      - name: Lint
        run: pnpm lint
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      # A PR that breaks module boundaries fails here rather than in review six months later.
      - name: Architecture boundaries
        run: pnpm arch:check

      # `pnpm format:check` over the whole tree fails today on files nobody in this PR touched; mass-reformatting would rewrite
      # files the other developers are editing. So: what this PR changes must be formatted, and the backlog shrinks as files
      # are touched.
      - name: Formatting of the files this PR changes
        if: github.event_name == 'pull_request'
        run: |
          files=$(git diff --name-only --relative --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- . \
            | grep -E '\.(ts|tsx|mts|cts|js|mjs|cjs|json|md|css|ya?ml)$' || true)
          if [ -z "$files" ]; then echo "no formattable files changed"; exit 0; fi
          echo "$files" | xargs pnpm exec prettier --check --ignore-unknown

      # Production dependencies only; high and critical fail the build. Accepted findings are listed with their reason in
      # package.json under pnpm.auditConfig.ignoreGhsas and in docs/runbooks/dependency-audit.md.
      - name: Dependency audit (production, high and above)
        run: pnpm audit --prod --audit-level=high

  database:
    name: Migrations from scratch · schema in sync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: crm-platform
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: crm
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U crm"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://crm:crm@localhost:5432/crm
      MIGRATION_DATABASE_URL: postgres://crm:crm@localhost:5432/crm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable && corepack prepare pnpm@9.15.4 --activate
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ hashFiles('crm-platform/pnpm-lock.yaml') }}
          restore-keys: pnpm-
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @crm/tax build && pnpm --filter @crm/contracts build && pnpm --filter @crm/db build

      - name: Migrations apply cleanly from scratch
        run: pnpm db:migrate
      - name: Migrations are immutable and in sync
        run: pnpm db:status
      - name: Drizzle schema matches the migrated database
        run: pnpm db:verify-schema
