name: Auth audit

# The authentication audit (crm-platform/tools/auth-audit): static checks, attack-input probes of the product's own security code,
# the auth test suites, dependency and secret scans, with a GO / CONDITIONAL / NO-GO verdict. Exit code 20 (NO-GO) fails the job.
#   pull request  quick mode, only when authentication code changed
#   nightly       full mode (adds the integration and e2e suites; Docker is available on the runner)
#   manual        either mode
on:
  pull_request:
    branches: [main]
    paths:
      - 'crm-platform/apps/api/src/modules/auth/**'
      - 'crm-platform/apps/api/src/realtime/**'
      - 'crm-platform/apps/api/src/config/**'
      - 'crm-platform/apps/web/src/lib/auth/**'
      - 'crm-platform/packages/contracts/src/auth-registration-security/**'
      - 'crm-platform/tools/auth-audit/**'
      - 'crm-platform/pnpm-lock.yaml'
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Also run the integration and e2e suites'
        type: boolean
        default: false

concurrency:
  group: auth-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: crm-platform
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@9.15.4 --activate
      - name: Run the audit
        run: node tools/auth-audit/run.mjs --install ${{ (github.event_name == 'schedule' || inputs.full) && '--full' || '' }}
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: auth-audit-${{ github.run_id }}
          path: crm-platform/reports/auth-audit/latest
          retention-days: 90
      - name: Summary
        if: always()
        run: |
          if [ -f reports/auth-audit/latest/report.md ]; then
            head -c 60000 reports/auth-audit/latest/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
