name: Security scan

# Static analysis (CodeQL for JavaScript/TypeScript) and secret scanning of the whole git history (gitleaks).
# Also enable GitHub secret scanning with push protection in the repository settings.
on:
  pull_request:
    branches: [main]
    paths: ['crm-platform/**', '.github/workflows/**']
  push:
    branches: [main]
  schedule:
    - cron: '30 21 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # An organisation-owned repository needs a GITLEAKS_LICENSE secret for this action.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
