name: Security fuzz

# Security fuzz testing (QA sheet 3, item 38): at least 1,000,000 generated malicious or invalid inputs per run, seeded and replayable, against every Zod
# schema in @crm/contracts, the URL and address guards, the webhook signature verifiers, the text parsers and sanitizers, and (a few thousand
# requests) every route of the API on a throwaway database.
#
# Manual on purpose, like security.yml: GitHub Actions jobs do not start on this account, so nothing here runs on a pull request, a push or a
# schedule. Start it from the Actions tab when the account is paid up (add a `schedule:` trigger then; a weekly run is the intent), or run the
# same thing on your own machine:
#   node crm-platform/tools/quality/fuzz.mjs                      (full profile, prints the seed)
#   node crm-platform/tools/quality/fuzz.mjs --seed <seed>        (replay a failed run)
# The small profile (20,000 inputs) already runs inside `pnpm test` (apps/api/test/unit/security/fuzz-ci.spec.ts).
on:
  workflow_dispatch:
    inputs:
      seed:
        description: Seed to replay (empty = a new random one, printed in the log)
        required: false
        default: ""
      http_requests:
        description: Requests for the HTTP layer phase (0 = skip)
        required: false
        default: "9000"

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  fuzz:
    name: Fuzz (>= 1,000,000 inputs)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: crm-platform
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable && corepack prepare pnpm@9.15.4 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @crm/config --filter @crm/tax --filter @crm/contracts --filter @crm/db --filter @crm/observability build
      - name: Run the fuzz suite
        env:
          SEED: ${{ inputs.seed }}
          HTTP_REQUESTS: ${{ inputs.http_requests }}
        run: |
          args="--profile full --out fuzz-result.json"
          if [ -n "$SEED" ]; then args="$args --seed $SEED"; fi
          if [ "$HTTP_REQUESTS" = "0" ]; then args="$args --no-http"; else args="$args --http-requests $HTTP_REQUESTS"; fi
          node tools/quality/fuzz.mjs $args
      - name: Keep the result when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-result
          path: crm-platform/fuzz-result.json
          if-no-files-found: ignore
