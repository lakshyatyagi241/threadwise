name: Authz audit

# The authorization / IDOR audit (crm-platform/tools/authz-audit): route inventory, policy declarations, static checks, and with --dynamic
# the generated tenant/role/IDOR matrix and the deep authz e2e specs against a real Postgres + Redis. Exit code 20 (NO-GO) fails the job.
#   pull request  static gate whenever a controller, guard, permission, contract or the tool itself changed (seconds, no Docker)
#   nightly       dynamic: the full matrix (Docker is available on the runner)
#   manual        either mode
# Pre-release: run `node tools/authz-audit/run.mjs --dynamic --strict` on the release commit; CONDITIONAL also blocks.
on:
  pull_request:
    branches: [main]
    paths:
      - 'crm-platform/apps/api/src/**/*.controller.ts'
      - 'crm-platform/apps/api/src/modules/auth/guards/**'
      - 'crm-platform/apps/api/src/kernel/rbac/**'
      - 'crm-platform/apps/api/src/modules/roles-permissions/**'
      - 'crm-platform/apps/api/src/modules/developer-rest-api-v1/**'
      - 'crm-platform/apps/api/src/realtime/**'
      - 'crm-platform/apps/api/test/e2e/authz/**'
      - 'crm-platform/packages/contracts/src/**'
      - 'crm-platform/tools/authz-audit/**'
  schedule:
    - cron: '30 21 * * *'
  workflow_dispatch:
    inputs:
      dynamic:
        description: 'Also run the generated matrix and deep specs (needs Docker)'
        type: boolean
        default: true

concurrency:
  group: authz-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: crm-platform
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@9.15.4 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @crm/contracts build && pnpm --filter @crm/db build
      - name: Run the audit
        run: node tools/authz-audit/run.mjs ${{ (github.event_name == 'schedule' || inputs.dynamic) && '--dynamic' || '' }}
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authz-audit-${{ github.run_id }}
          path: crm-platform/reports/authz-audit/latest
          retention-days: 90
      - name: Summary
        if: always()
        run: |
          if [ -f reports/authz-audit/latest/report.md ]; then
            head -c 60000 reports/authz-audit/latest/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
