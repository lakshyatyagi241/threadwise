name: PR checks

# Runs on every pull request into main that touches crm-platform. Nothing is deployed here: merging the PR is a push to main,
# and that is what triggers "Deploy desk.wabo.ai". These checks are what should be green before you merge.
on:
  pull_request:
    branches: [main]
    paths: ['crm-platform/**', '.github/workflows/**']

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The job to mark REQUIRED in branch protection. A dependency bump (Dependabot or by hand) that breaks a shared package or the
  # types cannot merge: zod 4 left @crm/contracts with 154 type errors and https-proxy-agent 9 broke the API's module resolution,
  # and both reached main because nothing here was a required check.
  build-and-typecheck:
    name: build-and-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: crm-platform
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@9.15.4 --activate
      - uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ hashFiles('crm-platform/pnpm-lock.yaml') }}
          restore-keys: pnpm-
      - run: pnpm install --frozen-lockfile
      # Builds the three shared packages (contracts is `tsc -p tsconfig.json`; any error fails the job).
      - run: pnpm --filter @crm/tax build && pnpm --filter @crm/contracts build && pnpm --filter @crm/db build
      - name: API typecheck
        run: pnpm --filter @crm/api exec tsc --noEmit -p tsconfig.json
      - name: API production build config typecheck
        run: pnpm --filter @crm/api exec tsc --noEmit -p tsconfig.build.json
      - name: Web typecheck
        # The web app is large enough that tsc exceeds Node's default heap on a runner ("heap out of memory"); give it room.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: cd apps/web && node scripts/gen-registry.mjs && pnpm exec tsc --noEmit -p .

  api-and-web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: crm-platform
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@9.15.4 --activate
      - uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ hashFiles('crm-platform/pnpm-lock.yaml') }}
          restore-keys: pnpm-
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @crm/tax build && pnpm --filter @crm/contracts build && pnpm --filter @crm/db build
      - name: API unit tests
        run: pnpm --filter @crm/api test
      # The release script is the forced command behind the deploy key: its flow (dump, migrate, restart, roll back) is tested against
      # a stub `docker`, and the compose file must still parse. Seconds, no dependencies.
      - name: Deploy scripts
        run: |
          bash deploy/hostinger/tests/ci-entry.test.sh
          docker compose -f deploy/hostinger/docker-compose.yml config -q 2>/dev/null

  images:
    # The two production images must still build: this is where a bad Dockerfile, a missing dependency or a failing `next build` shows up.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: crm-platform
          file: crm-platform/apps/api/Dockerfile
          push: false
          cache-from: type=gha,scope=api
      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: crm-platform
          file: crm-platform/apps/web/Dockerfile
          push: false
          cache-from: type=gha,scope=web
