# Weekly dependency updates, grouped so a week's minor and patch bumps arrive as one PR rather than thirty.
#
# MAJOR VERSIONS ARE NEVER OPENED BY DEPENDABOT (npm, docker). Two auto-merged majors (zod 3 -> 4, https-proxy-agent 7 -> 9) broke
# main for a day: a major changes the API or the type resolution, and a green dependency PR proves nothing about that.
# How a major is done on purpose: someone creates a branch (`chore/deps-<package>-<major>`), bumps the package by hand, fixes every
# call site and type error in the same branch, runs the full gate (`bash .claude/skills/pre-pr/scripts/gate.sh`), and opens a
# migration PR that a reviewer approves. Nothing here auto-merges, and no workflow in .github/workflows approves or merges a
# Dependabot PR. (The check workflows were removed in #328 while Actions is unavailable; when they return, require a job that builds
# @crm/contracts and runs tsc for api and web, with branch protection on main and "Allow auto-merge" off.)
# GitHub Actions majors (checkout v6 -> v7) are the exception: they are low risk and arrive as ONE group PR (group `actions-major`, labels dependencies + ci).
# Keep this file at the repository root: GitHub ignores it anywhere else.
version: 2
updates:
  - package-ecosystem: npm
    directory: /crm-platform
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ['dependencies']
    groups:
      # The Nest framework packages share one major version; @nestjs/testing must match @nestjs/common or
      # test suites fail with "Cannot find module .../@nestjs/common/internal". They move together, majors included.
      # swagger, config and schedule peer-depend on the same Nest major (a lagging @nestjs/swagger fails with
      # "Cannot find module .../@nestjs/common/interfaces.js"), so they ride in the same PR.
      # Listed first: a dependency lands in the first group it matches.
      nestjs-framework:
        patterns:
          - '@nestjs/common'
          - '@nestjs/core'
          - '@nestjs/testing'
          - '@nestjs/platform-*'
          - '@nestjs/websockets'
          - '@nestjs/swagger'
          - '@nestjs/config'
          - '@nestjs/schedule'
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Every major, for every package (see the header). Minor and patch still arrive in the groups above.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # Mobile app: the Expo SDK pins these together. They move in an SDK upgrade (docs/adr/0022), never one by one.
      - dependency-name: 'expo'
      - dependency-name: 'expo-*'
      - dependency-name: '@expo/*'
      - dependency-name: 'react-native'
      - dependency-name: 'react-native-*'
      - dependency-name: '@react-native/*'
      - dependency-name: '@react-native-community/*'
      - dependency-name: 'jest-expo'
      - dependency-name: 'react-test-renderer'
      - dependency-name: '@sentry/react-native'
      # zod 4 is a rewrite: ZodEffects is gone, z.record takes two arguments, error maps and several chained methods changed. The shared
      # contracts, the API, the web app and the mobile app all build on the zod 3 API (a 4.6.5 bump left @crm/contracts with 154 type
      # errors). Moving to zod 4 is a planned migration of every schema, not a routine bump: hold the major until then.
      - dependency-name: 'zod'
        update-types: ['version-update:semver-major']
      # https-proxy-agent 9 ships ESM-only types behind `exports`, which the API's `moduleResolution: node` cannot read ("Cannot find
      # module 'https-proxy-agent'"). Hold the major until the API moves to node16/bundler resolution.
      - dependency-name: 'https-proxy-agent'
        update-types: ['version-update:semver-major']
      # socks-proxy-agent 10 has the same problem: its types sit behind `exports` only, so `tsc` fails with "Cannot find module
      # 'socks-proxy-agent'" in the node-bridge proxy (the 10.1.0 bump in #297 was reverted in #308). Same hold as https-proxy-agent.
      - dependency-name: 'socks-proxy-agent'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: ['dependencies', 'ci']
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
      # Majors of an action are one clearly labelled PR that a person reviews; never auto-merged.
      actions-major:
        update-types: [major]
    commit-message:
      prefix: 'chore(ci)'

  # The base images of the two production images (node:22-alpine and friends).
  - package-ecosystem: docker
    directory: /crm-platform/apps/api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    labels: ['dependencies', 'docker']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'chore(deps)'
  - package-ecosystem: docker
    directory: /crm-platform/apps/web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    labels: ['dependencies', 'docker']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'chore(deps)'
